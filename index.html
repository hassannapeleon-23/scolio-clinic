    if(!validRemote(k,row.value))throw new Error('bad remote '+k);
    const rtxt=JSON.stringify(row.value);
    if(meta.rev[k]===row.rev&&!meta.dirty[k]){base[k]=rtxt;return false}
    if(meta.dirty[k]&&base[k]&&meta.rev[k]>0&&loc){
      let lo=null,bo=null;try{lo=JSON.parse(loc);bo=JSON.parse(base[k])}catch(e){}

  /* ---------- push ---------- */
  async function pushOne(k,loc){
    const iso=new Date().toISOString(),by=JSON.stringify(typeof ACTOR==='string'?ACTOR:'');
    if(meta.rev[k]===0){
      const r=await http('POST','/rest/v1/kv','{"key":"'+k+'","value":'+loc+',"rev":1,"updated_at":"'+iso+'","updated_by":'+by+'}','return=minimal');
      if(r.ok)return 1;
      if(r.status===409)return 0;
      throw new Error('insert '+r.status);
    }
    const n=meta.rev[k]+1;
    const r=await http('PATCH','/rest/v1/kv?key=eq.'+k+'&rev=eq.'+meta.rev[k]+'&select=rev','{"value":'+loc+',"rev":'+n+',"updated_at":"'+iso+'","updated_by":'+by+'}','return=representation');

  /* ---------- polling ---------- */
  function afterAdopt(){

  async function poll(){

      if(!r.ok)throw new Error('poll '+r.status);

      for(const row of (r.json||[])){if(KS.includes(row.key)&&row.rev!==meta.rev[row.key]){if(await reconcile(row.key))changed=true}}
      saveMeta();

  /* ---------- start-up (runs before the app reads its data) ---------- */
  async function init(){

      try{

        saveMeta();

/* arrow-key navigation inside tables */
function focusCell(cell){const f=cell.querySelector('input:not([type=hidden]):not([disabled]),select:not([disabled]),textarea:not([disabled]),button:not([disabled]),a[href]');
  if(f){f.focus();if(/^(INPUT|TEXTAREA)$/.test(f.tagName)&&f.type!=='checkbox'&&f.select){try{f.select()}catch(_){}}}else{cell.tabIndex=-1;cell.focus()}
  try{(f||cell).scrollIntoView({block:'nearest',inline:'nearest'})}catch(_){}}
document.addEventListener('keydown',function(e){
  const k=e.key;
  if((k==='Enter'||k===' ')&&e.target&&e.target.tagName==='TD'&&!UI.modal){const td=e.target;if(td.classList.contains('add')){e.preventDefault();td.click();return}
    if(k==='Enter'){const b=td.querySelector('button')||td.parentElement.querySelector('button.link,button');if(b){e.preventDefault();b.click()}}return}
  if(!/^Arrow(Up|Down|Left|Right)$/.test(k)||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||UI.modal)return;
  const t=e.target;if(!t||!t.closest)return;const td=t.closest('td,th');if(!td)return;const table=td.closest('table');if(!table)return;
  const tag=t.tagName,ty=t.type||'',ud=(k==='ArrowUp'||k==='ArrowDown');
  if(tag==='INPUT'&&/^(date|month|time|datetime-local)$/.test(ty))return;
  if(tag==='SELECT'&&ud)return;
  if(tag==='TEXTAREA'){const v=t.value,a=t.selectionStart===0&&t.selectionEnd===0,z=t.selectionStart===v.length;if(k==='ArrowUp'&&!a)return;if(k==='ArrowDown'&&!z)return;if(k==='ArrowLeft'&&!z)return;if(k==='ArrowRight'&&!a)return}
  if(tag==='INPUT'&&!ud&&t.selectionStart!=null){const v=t.value;if(k==='ArrowLeft'&&t.selectionEnd!==v.length)return;if(k==='ArrowRight'&&t.selectionStart!==0)return}
  const tr=td.parentElement,cells=Array.from(tr.children),ci=cells.indexOf(td);let cell=null;
  if(ud){const rows=Array.from(table.rows);let ri=rows.indexOf(tr)+(k==='ArrowDown'?1:-1);const r=rows[ri];if(r&&r.cells.length)cell=r.cells[Math.min(ci,r.cells.length-1)]}
  else{const rtl=document.documentElement.dir==='rtl',vr=k==='ArrowRight';cell=cells[ci+(rtl?(vr?-1:1):(vr?1:-1))]}
  if(!cell)return;e.preventDefault();focusCell(cell)});
try{const mo=new MutationObserver(()=>{document.querySelectorAll('td.add:not([tabindex])').forEach(x=>x.tabIndex=0)});mo.observe(document.body,{childList:true,subtree:true})}catch(_){}

function warnLamp(did,pid){const purs=IDX.patPur[pid]||[];let base='2026-11-26';for(const u of purs)if(u.date>base||base==='2026-11-26'&&purs.length&&false)base=u.date;
  if(purs.length){base=purs.reduce((a,u)=>u.date>a?u.date:a,'0000-00-00')}
  let n=0;for(const x of IDX.patSes[pid]||[]){if(x.status!=='active'||x.doctorId!==did||x.date<base)continue;n++}
  const k=Math.floor(n/6);return k<1?'':' <span title="'+n+' جلسات معاك '+(purs.length?'من آخر باقة':'من تاريخ التحديث')+'" style="font-size:15px">'+'🟡'.repeat(Math.min(k,4))+'</span>'}

function exMatches(name){const n=norm(name||'');if(!n)return[];const ids=new Set(S.patients.filter(p=>p.examOnly&&norm(p.name)===n).map(p=>p.id));
  return(S.exams||[]).filter(e=>(!e.patientId&&e.patientName&&norm(e.patientName)===n)||(e.patientId&&ids.has(e.patientId)))}
function linkExamsTo(np,name){const l=exMatches(name);if(!l.length)return;const old=new Set();
  for(const e of l){if(e.patientId&&e.patientId!==np.id)old.add(e.patientId);e.patientId=np.id;e.patientName=''}
  for(const id of old){const q=patById(id);if(q&&q.examOnly&&!(IDX.patSes[id]||[]).length&&!(IDX.patApps[id]||[]).length&&!(IDX.patPur[id]||[]).length&&!(IDX.patTx[id]||[]).length)S.patients=S.patients.filter(x=>x.id!==id)}
  logA('exam',np.id,'ربط '+l.length+' كشف بالمريض',[{field:'المريض',from:'',to:np.id}],'',np.id)}
function curDates(p){const u=curPkg(p.id);let l=(IDX.patSes[p.id]||[]).filter(x=>x.status==='active'&&(!u||x.purchaseId===u.id)).sort(cmpSess);if(!u)l=l.slice(-12);
  return l.length?l.map((x,i)=>'<span class="chip" title="'+x.date+'">'+(i+1)+': '+x.date.slice(5).replace('-','/')+'</span>').join(' '):'<span class="muted">—</span>'}
function curMoney(p,k){const u=curPkg(p.id),d=pdOf(p.id);let v;if(u){const x=IDX.pu[u.id];v=k==='col'?x.col:x.out}else v=k==='col'?d.collected:d.outstanding;return '<span class="n">'+nfmt(v)+' ج</span>'}

      {k:'doctorId',label:'الدكتور',type:'select',req:true,options:()=>[{v:'',l:'اختر الدكتور'}].concat(S.doctors.filter(x=>x.active).map(x=>({v:x.id,l:x.name})))},

    onSave(d){const a=createAppointment({patientId:d.patientId,schedDoctorId:d.doctorId,doctorId:d.doctorId,date,time:d.time,duration:S.settings.slot});
