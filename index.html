<style>
/* Layout: RTL admin shell. Collapsible sidebar at the inline-start, sticky top bar with global search, one content column. */
:root{
  --navy:#3C408E; --teal:#67C4D9;
  --bg:#F1F3FA; --surface:#FFFFFF; --surface-2:#F6F7FC; --ink:#1F2347; --muted:#565D80;
  --line:#DFE2F0; --line-strong:#C3C8E0;
  --accent:#3C408E; --accent-ink:#FFFFFF; --accent-soft:#E3F5FA; --accent-2:#67C4D9; --head:#3C408E; --nav-on:#E8EAF8;
  --ok:#17744A; --ok-bg:#E1F3E9; --warn:#8F5A0E; --warn-bg:#FAEFD6; --bad:#B0261D; --bad-bg:#FBE5E2;
  --free:#3C408E; --free-bg:#E7E9F8; --shadow:0 1px 2px rgba(60,64,142,.07),0 10px 30px rgba(60,64,142,.10);
  --f-display:'Cairo','Tajawal',system-ui,sans-serif; --f-body:'Tajawal','Cairo',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#AEB3F2; --teal:#67C4D9;
  --bg:#0D1024; --surface:#151935; --surface-2:#1B2041; --ink:#E7E9F8; --muted:#A3A9CC;
  --line:#272C57; --line-strong:#3A4180;
  --accent:#67C4D9; --accent-ink:#06222B; --accent-soft:#13303D; --accent-2:#2C7C90; --head:#C5C9F7; --nav-on:#222859;
  --ok:#5FD08F; --ok-bg:#163021; --warn:#E8B45C; --warn-bg:#352A12; --bad:#FF8A80; --bad-bg:#3A1A18;
  --free:#AEB3F2; --free-bg:#232954; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#AEB3F2; --teal:#67C4D9;
  --bg:#0D1024; --surface:#151935; --surface-2:#1B2041; --ink:#E7E9F8; --muted:#A3A9CC;
  --line:#272C57; --line-strong:#3A4180;
  --accent:#67C4D9; --accent-ink:#06222B; --accent-soft:#13303D; --accent-2:#2C7C90; --head:#C5C9F7; --nav-on:#222859;
  --ok:#5FD08F; --ok-bg:#163021; --warn:#E8B45C; --warn-bg:#352A12; --bad:#FF8A80; --bad-bg:#3A1A18;
  --free:#AEB3F2; --free-bg:#232954; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}

*{box-sizing:border-box}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;background:var(--bg);color:var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3;color:var(--head)}
h1{font-size:24px;font-weight:800} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:inline-block;vertical-align:middle}
.n{display:inline-block;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm-t{font-size:13px}

/* shell */
.app{display:flex;gap:18px;align-items:flex-start;max-width:1480px;margin-inline:auto;padding-block:12px}
.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));width:236px;flex:none;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:14px 10px;height:calc(100vh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:width .15s ease}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}

.brand b{font-family:var(--f-display);font-size:16px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2;white-space:nowrap}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:9px;cursor:pointer;text-align:start;color:var(--muted);font-weight:500}
.nav span{white-space:nowrap}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--nav-on);color:var(--head);font-weight:700;box-shadow:inset -3px 0 0 var(--teal)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px;border-top:1px solid var(--line);white-space:nowrap}
.app.collapsed .side{width:66px}
.app.collapsed .nav span,.app.collapsed .brand div,.app.collapsed .side-foot{display:none}
.app.collapsed .nav{justify-content:center}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.top{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:0 1px 2px rgba(60,64,142,.06)}
.top .ttl{font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap}
.gsearch{flex:1;min-width:0;max-width:520px;margin-inline-start:auto}
.scrim{display:none}
main{display:flex;flex-direction:column;gap:16px;min-width:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  border-radius:9px;padding:7px 13px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn.sm{padding:3px 10px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.dim{opacity:.55}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:8px;cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib.del:hover{color:var(--bad);background:var(--bad-bg)}
.ib[disabled]{opacity:.35;cursor:not-allowed}
.link{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font-weight:700;text-align:start}
.link:hover{color:var(--head);text-decoration:underline}
.inp,.sel,.ta{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 11px;min-height:40px}
.ta{min-height:76px;resize:vertical}
.inp:focus,.sel:focus,.ta:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;inset-inline-start:12px;color:var(--muted);pointer-events:none}
.search .inp{padding-inline-start:38px;padding-inline-end:38px}
.search .clr{position:absolute;inset-inline-end:6px}
.clr[hidden]{display:none!important}
.search.big .inp{min-height:48px;font-size:16px;border-width:2px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}

<script>
(function(){
try{document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','ar');}catch(e){}
'use strict';
/* =====================================================================
   CORE: data model, calculations and actions (no DOM here)
   Entities: doctors, absences, packages, patients (central), purchases (price snapshot),
   appointments (scheduled vs treating doctor), sessions (one per completed attendance),
   ledger (patient payments / refunds / reversals), payouts (to doctors), audit.
   ===================================================================== */
const KEY='tc_state_v3_excel',KEY_OLD='tc_state_v1_unused';let ACTOR='النظام';
const NAMES_M=['محمد','علي','إبراهيم','حسام','كريم','طارق','هشام','ياسر','مازن','زياد','آدم','رامي','وليد','شادي','أيمن','باسم','تامر','عادل','فادي','ماجد','نبيل','سامح','خالد','أسامة','بلال','حمزة','جابر','سيف','صبري','عمرو','فارس','لؤي','معاذ','نادر','هاني','وائل','يحيى','أنس','إيهاب','جلال','رضا','شريف','عماد','مجدي'];
const NAMES_F=['فاطمة','هدى','ليلى','منى','رنا','دينا','سلمى','نادية','هالة','رحاب','إيمان','شيماء','أميرة','ياسمين','جيهان','لمياء','ريم','هبة','عبير','سماح','داليا','نهى','رشا','مي','ندى','أسماء','بسمة','تقى','جميلة','حنان','خلود','دعاء','رباب','زينب','سهير','صفاء','عفاف','غادة','كوثر','لبنى','مروة','ميار','نجلاء','وفاء'];
const FATHERS=['سعيد','حسين','فتحي','رمضان','صلاح','جمال','عصام','سمير','نصر','عاطف','حمدي','سيد','فؤاد','لطفي','منصور','شعبان','كمال','رفعت','بدر','زكريا','عزت','أنور','ناصر','إسماعيل','عوض','شوقي','مرسي','عبد الله','عبد العزيز','عثمان','يونس','طه','درويش','مختار'];
const FAMILIES=['الشريف','النجار','البنا','العطار','الحداد','المصري','الجندي','فرج','حجازي','سلامة','عيسى','عبد الحميد','رزق','غانم','زيدان','الصاوي','البدري','القاضي','الجمال','الدسوقي'];
const DOCTOR_NAMES=['د. أحمد محمود','د. سارة محمد','د. عمر خالد','د. مريم إبراهيم','د. يوسف علي','د. نورهان حسن','د. مصطفى عبد الرحمن','د. آية مصطفى'];
const DEFAULT_PACKAGES=[{name:'باقة علاج',sessions:12,price:0}];
const METHODS=['نقدًا','تحويل بنكي','فودافون كاش','إنستاباي','بطاقة'];
const NOTES=['يحتاج متابعة أسبوعية','تم الاتفاق على خطة علاجية','يفضل المواعيد المسائية','محوّل من طبيب آخر','حالة مستقرة','يرجى التذكير قبل الجلسة بيوم','يحضر مع أحد أفراد الأسرة'];
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WEEK_ORDER=[6,0,1,2,3,4,5];
const APP_L={scheduled:'لم يُسجَّل بعد',attended:'حضر',missed:'لم يحضر',cancelled:'محذوف'};
const CAT_L={package:'باقة كاملة',persession:'دفع بالجلسة',free:'مجاني'};
const CAT_LP={package:'الباقات الكاملة',persession:'الدفع بالجلسة',free:'الحالات المجانية'};
const PSTAT_L={paid:'مدفوع',partial:'مدفوع جزئياً',unpaid:'غير مدفوع',free:'مجاني',refunded:'مُسترد',none:'لا مستحقات'};
const PAT_L={active:'نشط',paused:'متوقف مؤقتاً',archived:'مؤرشف'};
const TX_L={payment:'دفعة',refund:'استرداد',reversal:'عكس / تصحيح',session:'جلسة منفذة',free:'جلسة مجانية'};

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const round2=n=>Math.round((n+Number.EPSILON)*100)/100;
function num(x){const v=parseFloat(x);return isFinite(v)?v:0}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseISO(s){const p=String(s).split('-');return new Date(+p[0],(+p[1])-1,+p[2])}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function addDaysS(s,n){return iso(addDays(parseISO(s),n))}
function todayISO(){return iso(new Date())}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000)}
function weekday(s){return parseISO(s).getDay()}
function startOfWeek(s){const d=parseISO(s);return iso(addDays(d,-((d.getDay()+1)%7)))}
function toMin(t){const p=String(t).split(':');return (+p[0])*60+(+p[1]||0)}
function fromMin(n){return pad(Math.floor(n/60))+':'+pad(n%60)}
function validTime(t){return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t))}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s))&&!isNaN(parseISO(s))}
function nowISO(){return new Date().toISOString()}
function nowLocal(){const d=new Date();return iso(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function norm(s){return String(s||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim()}
function digitsOnly(s){return String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'')}
function csvEsc(v){if(typeof v==='number')return String(v);v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n\r\t]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows){return rows.map(r=>r.map(csvEsc).join(',')).join('\r\n')}
function toTSV(rows){return rows.map(r=>r.map(v=>String(v==null?'':v).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\r\n')}

/* ---------- state ---------- */
let S=null,IDX=null,SYNC_HOOK=null;
function lzC(s){const B=0xD800,M=0xF7FF;const d=new Map();let nx=B,w='',o=[];
 const code=x=>x.length===1?x.charCodeAt(0):d.get(x);const em=x=>{const c=code(x);o.push(String.fromCharCode(c<B?c:c+0x800))};
 for(let i=0;i<s.length;i++){const ch=s[i];if(w===''){w=ch;continue}const wc=w+ch;if(d.has(wc))w=wc;else{em(w);if(nx>M){d.clear();nx=B}else d.set(wc,nx++);w=ch}}
 if(w!=='')em(w);return o.join('')}
function lzD(z){const B=0xD800,M=0xF7FF;let d=[],nx=B,prev=null,o=[];
 for(let i=0;i<z.length;i++){let c=z.charCodeAt(i);if(c>=0xE000)c-=0x800;let e,rs=false;
  if(prev!==null&&nx>M){d=[];nx=B;rs=true}
  if(c<B)e=String.fromCharCode(c);else{e=d[c-B];if(e===undefined)e=prev+prev[0]}
  if(prev!==null&&!rs){d[nx-B]=prev+e[0];nx++}
  o.push(e);prev=e}
 return o.join('')}

const LS={get(k){try{let v=localStorage.getItem(k);if(v&&v.startsWith('Z1:'))v=lzD(v.slice(3));return v}catch(e){return null}},set(k,v){try{if(v.length>1200000&&!/[\uD800-\uDFFF]/.test(v))v='Z1:'+lzC(v);localStorage.setItem(k,v);return true}catch(e){return false}}};
function defaultSettings(){return{hours:{start:'10:00',end:'22:00'},slot:60,workDays:[6,0,1,2,3,4],rate:0.2,compBasis:'earned',
  free:{mode:'fixed',assignedValue:0,fixedAmount:40,costBasis:'comp'}}}
function emptyState(){return{v:2,center:'SCOLIO',settings:defaultSettings(),seq:{},doctors:[],absences:[],packages:[],patients:[],purchases:[],appointments:[],sessions:[],ledger:[],payouts:[],audit:[],expenses:[],exams:[],daily:[],monthly:[],braces:[],docAtt:[]}}
function nid(k){S.seq[k]=(S.seq[k]||0)+1;const n=S.seq[k];
  const f={p:['P-',4],s:['S-',5],t:['T-',5],a:['A-',5],pu:['PU-',4],au:['L-',5],ab:['AB-',3],po:['PO-',4],br:['BR-',4],bp:['BP-',4],da:['DA-',5],pn:['N-',5],d:['d',0],pk:['pk',0]}[k];
  return f[0]+(f[1]?String(n).padStart(f[1],'0'):n)}
function hist(action,detail,reason){return{ts:nowISO(),user:ACTOR,action,detail,reason:reason||''}}
function logA(entity,ref,summary,changes,reason,patientId){S.audit.push({id:nid('au'),ts:nowISO(),user:ACTOR,entity,ref,summary,changes:changes||[],reason:reason||'',patientId:patientId||null})}
let SAVE_OK=true;
function save(){SAVE_OK=LS.set(KEY,JSON.stringify(S));if(SYNC_HOOK)SYNC_HOOK('state');return SAVE_OK}
function commit(){buildIdx();return save()}

/* ---------- index & derived values (single source for every page) ---------- */
function cmpSess(a,b){return a.date<b.date?-1:a.date>b.date?1:a.time<b.time?-1:a.time>b.time?1:a.id<b.id?-1:a.id>b.id?1:0}
function buildIdx(){
  const I={pat:new Map(),doc:new Map(),pur:new Map(),app:new Map(),ses:new Map(),pkg:new Map(),tx:new Map(),
    col:{},patCol:{},patPend:{},used:{},patSes:{},patApps:{},patPur:{},patTx:{},sc:{},bucketSes:{},pd:{},pu:{}};
  for(const p of S.patients){I.pat.set(p.id,p);I.patSes[p.id]=[];I.patApps[p.id]=[];I.patPur[p.id]=[];I.patTx[p.id]=[]}
  for(const d of S.doctors)I.doc.set(d.id,d);
  for(const k of S.packages)I.pkg.set(k.id,k);
  for(const u of S.purchases){I.pur.set(u.id,u);I.used[u.id]=0;if(I.patPur[u.patientId])I.patPur[u.patientId].push(u)}
  for(const t of S.ledger){I.tx.set(t.id,t);if(!I.pat.has(t.patientId))continue;if(t.status!=='removed')I.patTx[t.patientId].push(t);
    if(t.status==='received'){I.col[t.bucket]=round2((I.col[t.bucket]||0)+t.amount);I.patCol[t.patientId]=round2((I.patCol[t.patientId]||0)+t.amount)}
    else if(t.status!=='removed')I.patPend[t.patientId]=round2((I.patPend[t.patientId]||0)+t.amount)}
  for(const s of S.sessions){I.ses.set(s.id,s);if(!I.pat.has(s.patientId))continue;I.patSes[s.patientId].push(s);
    if(s.status==='active'){if(s.purchaseId&&I.used[s.purchaseId]!=null)I.used[s.purchaseId]++;(I.bucketSes[s.bucket]=I.bucketSes[s.bucket]||[]).push(s)}}
  for(const a of S.appointments){I.app.set(a.id,a);if(I.patApps[a.patientId])I.patApps[a.patientId].push(a)}
  /* eligible revenue per completed session: FIFO against money actually collected in the same bucket */
  for(const b in I.bucketSes){
    const list=I.bucketSes[b].slice().sort(cmpSess);let rem=Math.max(0,I.col[b]||0);
    for(const s of list){
      if(s.kind==='free'){I.sc[s.id]={kind:'free',eligible:0,doctor:ruleFixed(s,s.comp||0),center:0,cost:ruleFixed(s,s.cost||0,true),value:s.basis||0,unfunded:0};continue}
      let el;
      if(s.compMode==='earned')el=s.value;else{el=Math.min(s.value,rem);rem=round2(rem-el)}
      el=Math.round(el*1e6)/1e6;const _ru=ruleFor(s);const dc=_ru?(_ru.type==='fixed'?round2(_ru.value):Math.round(el*(_ru.value/100)*1e6)/1e6):Math.round(el*s.rate*1e6)/1e6;
      I.sc[s.id]={kind:'paid',eligible:el,doctor:dc,center:round2(el-dc),cost:0,value:s.value,unfunded:round2(s.value-el)};
    }
  }
  for(const u of S.purchases){
    const used=I.used[u.id],col=I.col[u.id]||0;
    const due=(u.status==='closed'||u.settled)?Math.max(0,col):u.price;
    I.pu[u.id]={used,remaining:(u.status==='closed'||u.settled)?0:Math.max(0,u.sessions-used),col,due,out:u.settled?0:Math.max(0,round2(due-col))};
  }
  for(const p of S.patients){
    const ses=I.patSes[p.id].filter(s=>s.status==='active'),completed=ses.length,purs=I.patPur[p.id];
    let total=0,remaining=null,due=0,out=0,allClosed=purs.length>0;
    for(const u of purs){const x=I.pu[u.id];due+=x.due;out+=x.out;if(u.status!=='closed')allClosed=false;if(p.category==='package'){total+=(u.status==='closed'||u.settled)?x.used:u.sessions}}
    if(p.category==='package'){remaining=0;for(const u of purs)remaining+=I.pu[u.id].remaining}
    else if(p.category==='free'){total=p.authorized||0;remaining=Math.max(0,total-completed)}
    else{total=completed}
    const ppsDue=round2(ses.filter(s=>s.kind==='pps').reduce((a,s)=>a+s.value,0)),ppsCol=I.col['pps:'+p.id]||0;
    due=round2(due+ppsDue);out=round2(out+(p.assumePaid?0:Math.max(0,ppsDue-ppsCol)));
    const col=I.patCol[p.id]||0;
    let over=0;for(const u of purs){if(u.status==='closed'||u.settled)continue;const x=I.pu[u.id];if(x.col-u.price>0.005)over+=x.col-u.price}
    if(!p.assumePaid&&ppsCol-ppsDue>0.005)over+=ppsCol-ppsDue;over=round2(over);
    let status;
    if(p.category==='free')status='free';
    else if(!purs.length&&ppsDue===0&&col===0)status='none';
    else if(allClosed&&due<=0&&col<=0&&ppsDue===0)status='refunded';
    else if(out<=0)status=(col<=0?'free':'paid');
    else if(col>0)status='partial';
    else status='unpaid';
    I.pd[p.id]={completed,total,remaining,due,collected:col,outstanding:out,status,pending:I.patPend[p.id]||0,over};
  }
  IDX=I;return I;
}
const pdOf=id=>IDX.pd[id]||{completed:0,total:0,remaining:0,due:0,collected:0,outstanding:0,status:'none',pending:0,over:0};
const patById=id=>IDX.pat.get(id);
const hasFak=id=>{const d=IDX.doc.get(id);return !!(d&&d.options&&d.options.indexOf('فك')>=0)};
const docById=id=>IDX.doc.get(id);
const appById=id=>IDX.app.get(id);
const docName=id=>{const d=IDX.doc.get(id);return d?d.name:'—'};
const patName=id=>{const p=IDX.pat.get(id);return p?p.name:'—'};
const activeDoctors=()=>S.doctors.filter(d=>d.active&&!d.examOnly);
function sessionsOfPatient(id){return(IDX.patSes[id]||[]).slice().sort(cmpSess)}
function appsOfPatient(id){return(IDX.patApps[id]||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.time<b.time?-1:a.time>b.time?1:0)}
function firstApptDate(id){const l=appsOfPatient(id).filter(a=>a.status!=='cancelled');return l.length?l[0].date:null}
function sessionComp(s){const c=IDX.sc[s.id];return c?c:{kind:s.kind==='free'?'free':'paid',eligible:0,doctor:0,center:0,cost:0,value:s.value||0,unfunded:0}}

/* ---------- scheduling ---------- */
function slotsList(from,to,step){const out=[];from=from||S.settings.hours.start;to=to||S.settings.hours.end;step=step||S.settings.slot;for(let m=toMin(from);m+step<=toMin(to);m+=step)out.push(fromMin(m));return out}
function overlaps(m1,d1,m2,d2){return m1<m2+d2&&m2<m1+d1}
function doctorConflicts(doctorId,date,time,dur,excludeId){const m=toMin(time);return S.appointments.filter(a=>a.id!==excludeId&&a.status!=='cancelled'&&a.doctorId===doctorId&&a.date===date&&overlaps(m,dur,toMin(a.time),a.duration))}
function patientConflicts(patientId,date,time,dur,excludeId){const m=toMin(time);return S.appointments.filter(a=>a.id!==excludeId&&a.status!=='cancelled'&&a.patientId===patientId&&a.date===date&&overlaps(m,dur,toMin(a.time),a.duration))}
function absenceAt(doctorId,date,time,dur){
  const m=toMin(time);
  return S.absences.find(ab=>ab.doctorId===doctorId&&ab.date<=date&&date<=(ab.dateTo||ab.date)&&(ab.allDay||overlaps(m,dur,toMin(ab.from),toMin(ab.to)-toMin(ab.from))))||null}
function doctorAvail(doctorId,date,time,dur){
  const d=IDX?IDX.doc.get(doctorId):S.doctors.find(x=>x.id===doctorId);
  if(!d)return{ok:false,reason:'الطبيب غير موجود',kind:'none'};
  if(!d.active)return{ok:false,reason:'الطبيب غير مفعّل',kind:'inactive'};
  const ab=absenceAt(doctorId,date,time,dur);
  if(ab)return{ok:false,reason:'الطبيب غائب'+(ab.reason?' ('+ab.reason+')':''),kind:'absent'};
  if(!d.workDays.includes(weekday(date)))return{ok:false,reason:'خارج أيام عمل الطبيب',kind:'off'};
  const m=toMin(time);if(m<toMin(d.start)||m+dur>toMin(d.end))return{ok:false,reason:'خارج ساعات عمل الطبيب',kind:'hours'};
  return{ok:true};
}
function needsSub(a){return false;if(a.status!=='scheduled')return false;const v=doctorAvail(a.doctorId,a.date,a.time,a.duration);return !v.ok&&(v.kind==='absent'||v.kind==='inactive')}
function checkSchedule(o){
  const errors=[],warnings=[];
  if(!validDate(o.date))errors.push('تاريخ الموعد غير صحيح.');
  if(!validTime(o.time))errors.push('وقت الموعد غير صحيح.');
  if(!(o.duration>0))errors.push('مدة الموعد يجب أن تكون أكبر من صفر.');
  if(errors.length)return{errors,warnings};
  const p=patById(o.patientId);
  if(!p)errors.push('المريض غير موجود.');
  else if(p.status==='archived')warnings.push('المريض مؤرشف — سيُعاد تفعيله تلقائياً عند حفظ الحجز.');
  else if(p.status==='paused')warnings.push('المريض متوقف مؤقتاً.');
  if(!docById(o.doctorId))errors.push('اختر الطبيب.');
  else{
    const c=doctorConflicts(o.doctorId,o.date,o.time,o.duration,o.excludeId);
    const v=doctorAvail(o.doctorId,o.date,o.time,o.duration);
    if(!v.ok)warnings.push(docName(o.doctorId)+': '+v.reason+'.');
  }
  const pc=patientConflicts(o.patientId,o.date,o.time,o.duration,o.excludeId);
  if(pc.length)warnings.push('تنبيه: المريض لديه موعد آخر متداخل في نفس الوقت ('+pc.map(x=>x.time+' عند '+docName(x.doctorId)).join('، ')+').');
  return{errors,warnings};
}
function createAppointment(d){
  {const _p=patById(d.patientId);if(_p&&_p.status==='archived'){_p.status='active';logA('patient',_p.id,'إعادة تفعيل تلقائية عند الحجز',[{field:'الحالة',from:'مؤرشف',to:'نشط'}],'',_p.id)}}
  const a={fak:!!d.fak&&hasFak(d.doctorId),id:nid('a'),patientId:d.patientId,schedDoctorId:d.schedDoctorId||d.doctorId,doctorId:d.doctorId,date:d.date,time:d.time,duration:d.duration,status:'scheduled',attendedAt:null,sessionId:null,note:d.note||'',createdAt:nowISO(),history:[hist('create','تم إنشاء الموعد '+d.date+' '+d.time)]};
  S.appointments.push(a);return a;

function findFreeSlot(doctorId,fromDate,days){
  const slots=slotsList();
  for(let i=0;i<(days||21);i++){const date=addDaysS(fromDate,i);
    for(const t of slots){if(doctorAvail(doctorId,date,t,S.settings.slot).ok&&!doctorConflicts(doctorId,date,t,S.settings.slot).length)return{date,time:t}}}
  return null;
}

/* ---------- sessions & attendance ---------- */
function docRate(id){const d=S.doctors.find(x=>x.id===id);return d&&d.rate!=null&&isFinite(d.rate)&&d.rate>=0&&d.rate<=1?d.rate:S.settings.rate}
function freeComp(did){const f=S.settings.free,r=docRate(did);let comp=0;
  if(f.mode==='percent')comp=round2(f.assignedValue*r);else if(f.mode==='fixed')comp=round2(f.fixedAmount);
  let cost=comp;if(f.mode!=='none'&&f.costBasis==='value')cost=Math.max(num(f.assignedValue),comp);
  return{comp,cost,basis:f.assignedValue,mode:f.mode}}
function livePurchaseUse(uid){let n=0;for(const s of S.sessions)if(s.status==='active'&&s.purchaseId===uid)n++;return n}
function pickPurchase(pid){
  const list=S.purchases.filter(u=>u.patientId===pid&&u.status==='active').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id<b.id?-1:1);
  for(const u of list)if(livePurchaseUse(u.id)<u.sessions)return u;return null}
function buildSession(p,a,doctorId,date,time,at){
  const s={fak:!!(a&&a.fak&&hasFak(doctorId)),id:nid('s'),patientId:p.id,appointmentId:a?a.id:null,date,time,doctorId,schedDoctorId:a?a.schedDoctorId:doctorId,status:'active',createdAt:at||nowISO(),history:[]};
  if(p.category==='package'){
    const u=pickPurchase(p.id);if(!u){Object.assign(s,{kind:'package',purchaseId:null,bucket:'ovf:'+p.id,value:0,rate:caseRate(p,doctorId),compMode:S.settings.compBasis,ovf:true});return{session:s}}
    const used=livePurchaseUse(u.id);let value=round2(u.price/u.sessions);
    if(used===u.sessions-1){let prior=0;for(const x of S.sessions)if(x.status==='active'&&x.purchaseId===u.id)prior+=x.value;value=round2(u.price-prior)}
    Object.assign(s,{kind:'package',purchaseId:u.id,bucket:u.id,value,rate:caseRate(p,doctorId),compMode:S.settings.compBasis});
  }else if(p.category==='persession'){
    if(!(p.perSessionPrice>0))s.noPrice=true;
    Object.assign(s,{kind:'pps',purchaseId:null,bucket:'pps:'+p.id,value:p.perSessionPrice||0,rate:caseRate(p,doctorId),compMode:S.settings.compBasis});
  }else{
    const done=S.sessions.filter(x=>x.patientId===p.id&&x.status==='active'&&x.kind==='free').length;
    if(p.authorized>0&&done>=p.authorized)s.over=true;
    const f=freeComp(doctorId);
    Object.assign(s,{kind:'free',purchaseId:null,bucket:'free:'+p.id,value:0,rate:caseRate(p,doctorId),compMode:S.settings.compBasis,basis:f.basis,freeMode:f.mode,comp:f.comp,cost:f.cost});
  }
  return{session:s};
}
/* the only place where attendance is recorded; every view calls this */
function attendCore(appId,o){
  o=o||{};const a=IDX.app.get(appId)||S.appointments.find(x=>x.id===appId);if(!a)return{ok:false,error:'الموعد غير موجود.'};
  if(a.status==='attended'&&a.sessionId){const s=S.sessions.find(x=>x.id===a.sessionId);if(s&&s.status==='active')return{ok:true,dup:true,msg:'تم تسجيل حضور هذا الموعد من قبل، لذلك لم تُحتسب جلسة جديدة.',session:s}}
  if(a.status==='cancelled')return{ok:false,error:'هذا الموعد ملغي. أعد جدولته أولاً.'};
  const p=S.patients.find(x=>x.id===a.patientId);if(!p)return{ok:false,error:'المريض غير موجود.'};
  if(p.status==='archived')return{ok:false,error:'المريض مؤرشف.'};
  const docId=o.doctorId||a.doctorId;
  const date=o.date||a.date,time=o.time||a.time;
  const r=buildSession(p,a,docId,date,time,o.at);
  if(r.error)return{ok:false,error:r.error};
  const s=r.session;s.history.push(hist('create','تسجيل جلسة بحضور المريض'));
  S.sessions.push(s);notifyPkg(p,s);
  a.status='attended';a.attendedAt=o.at||nowLocal();a.sessionId=s.id;a.doctorId=docId;
  a.history.push(hist('attend','حضر المريض وتم تسجيل الجلسة '+s.id+' عند '+docName(docId)));
  if(!o.silent){logA('session',s.id,'تسجيل حضور',[{field:'الموعد',from:'مجدول',to:'حضر'}],'',p.id);commit()}
  return{ok:true,session:s,ovf:!!(s.ovf||s.over||s.noPrice),msg:attMsg(p,s)};
}
function unattendCore(appId,o){
  o=o||{};const a=S.appointments.find(x=>x.id===appId);if(!a)return{ok:false,error:'الموعد غير موجود.'};

function setApptStatus(appId,status,reason){
  const a=S.appointments.find(x=>x.id===appId);if(!a)return{ok:false,error:'الموعد غير موجود.'};
  if(a.status==='attended')return{ok:false,error:'تراجع عن الحضور أولاً.'};

  if(status==='scheduled'){const c=checkSchedule({patientId:a.patientId,doctorId:a.doctorId,date:a.date,time:a.time,duration:a.duration,excludeId:a.id});if(c.errors.length)return{ok:false,error:c.errors[0]}}

  commit();return{ok:true,msg:status==='cancelled'?'تم إلغاء الموعد (محفوظ في السجل).':'تم تحديث حالة الموعد.'};
}
function updateAppointment(appId,f,reason){
  const a=S.appointments.find(x=>x.id===appId);if(!a)return{ok:false,error:'الموعد غير موجود.'};
  const n={date:f.date!=null?f.date:a.date,time:f.time!=null?f.time:a.time,duration:f.duration!=null?Math.round(num(f.duration)):a.duration,
    schedDoctorId:f.schedDoctorId||a.schedDoctorId,doctorId:f.doctorId||a.doctorId,note:f.note!=null?f.note:a.note};
  n.fak=(f.fak!=null?!!f.fak:!!a.fak)&&hasFak(n.doctorId);
  const attended=a.status==='attended';
  const ch=[];
  const add=(field,from,to)=>{if(from!==to)ch.push({field,from,to})};
  add('التاريخ',a.date,n.date);add('الوقت',a.time,n.time);add('المدة (دقيقة)',String(a.duration),String(n.duration));
  add('الطبيب المجدول',docName(a.schedDoctorId),docName(n.schedDoctorId));add('الطبيب الذي قام بالجلسة',docName(a.doctorId),docName(n.doctorId));add('ملاحظات',a.note||'',n.note||'');add('فك',a.fak?'نعم':'لا',n.fak?'نعم':'لا');
  if(!ch.length)return{ok:true,nochange:true};
  
  const timing=n.date!==a.date||n.time!==a.time||n.duration!==a.duration||n.doctorId!==a.doctorId;
  if(timing&&a.status!=='cancelled'){const c=checkSchedule({patientId:a.patientId,doctorId:n.doctorId,date:n.date,time:n.time,duration:n.duration,excludeId:a.id});if(c.errors.length)return{ok:false,error:c.errors[0]}}
  Object.assign(a,n);
  a.history.push(hist('edit',ch.map(c=>c.field+': '+c.from+' ← '+c.to).join(' | '),reason));
  if(attended&&a.sessionId){const s=S.sessions.find(x=>x.id===a.sessionId);
    if(s&&s.status==='active'){const sc=[];if(s.date!==a.date)sc.push('التاريخ '+s.date+' ← '+a.date);if(s.time!==a.time)sc.push('الوقت '+s.time+' ← '+a.time);if(s.doctorId!==a.doctorId)sc.push('الطبيب '+docName(s.doctorId)+' ← '+docName(a.doctorId));
      s.date=a.date;s.time=a.time;s.fak=!!a.fak;s.doctorId=a.doctorId;s.schedDoctorId=a.schedDoctorId;if(sc.length)s.history.push(hist('edit','تصحيح بيانات الجلسة: '+sc.join(' | '),reason))}}
  logA('appointment',a.id,'تعديل الموعد',ch,reason,a.patientId);
  commit();return{ok:true,msg:'تم حفظ تعديل الموعد وسجل التغيير.'};
}

const PFIELDS={name:'الاسم',phone:'الهاتف',doctorId:'الطبيب الأساسي',category:'الفئة',perSessionPrice:'سعر الجلسة',authorized:'الجلسات المصرّح بها',status:'حالة المريض',startDate:'تاريخ بداية المتابعة',notes:'ملاحظات'};
function patientDiff(p,n){
  const ch=[];
  for(const k of Object.keys(PFIELDS)){if(n[k]===undefined)continue;let from=p[k],to=n[k];
    if(k==='perSessionPrice'||k==='authorized'){from=num(from);to=num(to)}
    if(from===to)continue;
    const show=v=>k==='doctorId'?docName(v):k==='category'?CAT_L[v]:k==='status'?PAT_L[v]:String(v==null?'':v);
    ch.push({key:k,field:PFIELDS[k],from:show(from),to:show(to),raw:to})}
  return ch;
}
function updatePatient(id,n,reason,opts){
  const p=S.patients.find(x=>x.id===id);if(!p)return{ok:false,error:'المريض غير موجود.'};
  if(!isFin()&&n&&n.perSessionPrice!==undefined)n=Object.assign({},n,{perSessionPrice:p.perSessionPrice});
  opts=opts||{};const ch=patientDiff(p,n);if(!ch.length)return{ok:true,nochange:true,msg:'لا توجد تغييرات.'};
  let moved=0,skipped=0;const oldDoc=p.doctorId;
  for(const c of ch){p[c.key]=(c.key==='perSessionPrice'||c.key==='authorized')?num(c.raw):c.raw}
  if(typeof p.name==='string')p.name=p.name.trim();
  if(ch.some(c=>c.key==='doctorId')&&opts.moveFuture){
    const t=todayISO();
    for(const a of S.appointments){if(a.patientId!==id||a.status!=='scheduled'||a.date<t)continue;if(a.schedDoctorId!==oldDoc&&a.doctorId!==oldDoc)continue;
      if(doctorConflicts(p.doctorId,a.date,a.time,a.duration,a.id).length){skipped++;continue}
      const old=a.doctorId;a.schedDoctorId=p.doctorId;a.doctorId=p.doctorId;a.history.push(hist('edit','نقل الموعد القادم إلى الطبيب الأساسي الجديد: '+docName(old)+' ← '+docName(p.doctorId),reason));moved++}
  }
  logA('patient',id,'تعديل بيانات المريض'+(moved?' (نقل '+moved+' موعد قادم)':''),ch.map(c=>({field:c.field,from:c.from,to:c.to})),reason,id);
  commit();return{ok:true,moved,skipped,msg:'تم حفظ بيانات المريض.'};
}
function archivePatient(id,reason){
  const p=S.patients.find(x=>x.id===id);if(!p)return{ok:false,error:'المريض غير موجود.'};
  const t=todayISO();let n=0;
  for(const a of S.appointments){if(a.patientId===id&&a.status==='scheduled'&&a.date>=t){a.status='cancelled';a.history.push(hist('status','إلغاء تلقائي بسبب أرشفة المريض',reason));n++}}
  p.status='archived';logA('patient',id,'أرشفة المريض (إلغاء '+n+' موعد قادم)',[{field:'حالة المريض',from:'نشط',to:'مؤرشف'}],reason,id);commit();
  return{ok:true,cancelled:n,msg:'تمت أرشفة المريض'+(n?' وإلغاء '+n+' موعد قادم':'')+'.'};
}
function deletePatient(id,reason){need('admin');

  S.ledger=S.ledger.filter(t=>t.patientId!==id);S.purchases=S.purchases.filter(u=>u.patientId!==id);S.audit=S.audit.filter(a=>a.patientId!==id);

  return{ok:true,msg:'تم حذف المريض '+p.name+' نهائياً.'};

function restorePatient(id){const p=S.patients.find(x=>x.id===id);if(!p)return{ok:false,error:'المريض غير موجود.'};
  logA('patient',id,'إعادة تفعيل المريض',[{field:'حالة المريض',from:PAT_L[p.status],to:'نشط'}],'',id);p.status='active';commit();return{ok:true,msg:'تمت إعادة تفعيل المريض.'}}
function searchPatients(q,limit){
  const t=norm(q),dg=digitsOnly(q);if(!t&&!dg)return[];
  const out=[];
  for(const p of S.patients){const nm=norm(p.name),code=p.id.toLowerCase();let rank=-1;
    if(code===String(q).trim().toLowerCase())rank=0;else if(nm.startsWith(t))rank=1;else if(nm.includes(t))rank=2;else if(code.includes(String(q).trim().toLowerCase()))rank=3;else if(dg.length>=3&&digitsOnly(p.phone).includes(dg))rank=4;
    if(rank>=0)out.push({p,rank})}
  out.sort((a,b)=>a.rank-b.rank||a.p.name.localeCompare(b.p.name,'ar'));
  return out.slice(0,limit||50).map(x=>x.p);
}

function updateDoctor(id,n,reason){

  const L={name:'الاسم',active:'الحالة',start:'بداية الدوام',end:'نهاية الدوام',workDays:'أيام العمل'};
  for(const k of Object.keys(L)){if(n[k]===undefined)continue;const a=k==='workDays'?d[k].map(i=>WD[i]).join('، '):k==='active'?(d[k]?'مفعّل':'غير مفعّل'):d[k];const b=k==='workDays'?n[k].map(i=>WD[i]).join('، '):k==='active'?(n[k]?'مفعّل':'غير مفعّل'):n[k];if(String(a)!==String(b)){ch.push({field:L[k],from:a,to:b});d[k]=k==='workDays'?n[k].slice().sort((x,y)=>x-y):n[k]}}

function futureApptsOfDoctor(id){const t=todayISO();return S.appointments.filter(a=>a.doctorId===id&&a.status==='scheduled'&&a.date>=t)}

function adjustPurchase(id,n,reason){need('money');

  const ch=[];if(price!==u.price)ch.push({field:'سعر الشراء',from:String(u.price),to:String(price)});if(sessions!==u.sessions)ch.push({field:'عدد الجلسات',from:String(u.sessions),to:String(sessions)});

  u.price=price;u.sessions=sessions;u.history.push(hist('adjust',ch.map(c=>c.field+': '+c.from+' ← '+c.to).join(' | '),reason));

/* ---------- ledger rows, finance, reports ---------- */
function ledgerRows(f){
  f=f||{};const rows=[];
  const inR=d=>(!f.from||d>=f.from)&&(!f.to||d<=f.to);
  const wantTx=!f.type||f.type==='payment'||f.type==='refund'||f.type==='reversal';
  const wantSes=!f.type||f.type==='session'||f.type==='free';
  if(wantTx)for(const t of S.ledger){const p=IDX.pat.get(t.patientId);if(!p||t.status!=='received')continue;
    if(f.type&&t.type!==f.type)continue;if(!inR(t.date))continue;if(f.patient&&p.id!==f.patient)continue;if(f.doctor&&p.doctorId!==f.doctor)continue;
    const u=IDX.pur.get(t.bucket);if(f.pkg&&(!u||u.packageId!==f.pkg))continue;
    rows.push({kind:'tx',id:t.id,date:t.date,time:'',createdAt:t.createdAt,patientId:p.id,type:t.type,cash:t.amount,basis:null,rate:null,doctorComp:null,center:null,doctorId:null,method:t.method,status:t.reversedBy?'معكوسة':'مستلمة',related:u?u.id+' · '+u.name:'دفع بالجلسة',note:t.note+(t.reason?' · سبب: '+t.reason:'')})}
  if(wantSes)for(const s of S.sessions){if(s.status!=='active')continue;const p=IDX.pat.get(s.patientId);if(!p)continue;
    const isFree=s.kind==='free';if(f.type==='free'&&!isFree)continue;if(f.type==='session'&&isFree)continue;
    if(!inR(s.date))continue;if(f.patient&&p.id!==f.patient)continue;if(f.doctor&&s.doctorId!==f.doctor)continue;
    const u=s.purchaseId?IDX.pur.get(s.purchaseId):null;if(f.pkg&&(!u||u.packageId!==f.pkg))continue;
    const c=sessionComp(s);
    rows.push({kind:'ses',id:s.id,date:s.date,time:s.time,createdAt:s.createdAt,patientId:p.id,type:isFree?'free':'session',cash:0,basis:isFree?s.basis:s.value,rate:s.rate,eligible:c.eligible,doctorComp:c.doctor,center:isFree?-c.cost:c.center,doctorId:s.doctorId,method:'',status:'منفذة',related:(u?u.name:isFree?'جلسة مجانية':(s.ovf?'جلسة بدون باقة':'دفع بالجلسة')),note:(s.doctorId!==s.schedDoctorId?'بديل عن '+docName(s.schedDoctorId):'')+(!isFree&&c.unfunded>0?(s.doctorId!==s.schedDoctorId?' · ':'')+'غير مغطّاة بالدفع: '+c.unfunded:'')})}
  rows.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.time<b.time?1:a.time>b.time?-1:0));
  return rows;
}
function sumRows(rows){
  const z={payments:0,refunds:0,reversals:0,netCash:0,eligible:0,paidDoctorComp:0,centerShare:0,freeComp:0,freeCost:0,sessions:0,freeSessions:0};
  for(const r of rows){
    if(r.kind==='tx'){z.netCash+=r.cash;if(r.type==='payment')z.payments+=r.cash;else if(r.type==='refund')z.refunds+=r.cash;else z.reversals+=r.cash}
    else if(r.type==='free'){z.freeComp+=r.doctorComp;z.freeCost+=-r.center;z.freeSessions++}
    else{z.eligible+=r.eligible;z.paidDoctorComp+=r.doctorComp;z.centerShare+=r.center;z.sessions++}
  }
  for(const k in z)z[k]=round2(z[k]);
  z.doctorComp=round2(z.paidDoctorComp+z.freeComp);z.net=round2(z.centerShare-z.freeCost);return z;
}
function payoutsSum(f){f=f||{};let s=0;for(const x of S.payouts){if(x.status!=='active')continue;if(f.doctor&&x.doctorId!==f.doctor)continue;if(f.from&&x.date<f.from)continue;if(f.to&&x.date>f.to)continue;s+=x.amount}return round2(s)}
function doctorCompAll(doctorId){let s=0;for(const x of S.sessions){if(x.status!=='active'||(doctorId&&x.doctorId!==doctorId))continue;if(!IDX.pat.has(x.patientId))continue;s+=sessionComp(x).doctor}return round2(s)}
function finSummary(f){
  f=f||{};const rows=ledgerRows(f),z=sumRows(rows);
  let out=0,unearned=0;
  for(const p of S.patients){if(f.patient&&p.id!==f.patient)continue;if(f.doctor&&p.doctorId!==f.doctor)continue;
    if(f.pkg&&!IDX.patPur[p.id].some(u=>u.packageId===f.pkg))continue;out+=pdOf(p.id).outstanding}
  for(const b in IDX.col){if(b.startsWith('pps:')){const pid=b.slice(4);if(f.patient&&pid!==f.patient)continue;}else{const u=IDX.pur.get(b);if(!u||(f.patient&&u.patientId!==f.patient)||(f.pkg&&u.packageId!==f.pkg))continue}
    const sessVal=(IDX.bucketSes[b]||[]).reduce((a,s)=>a+IDX.sc[s.id].eligible,0);unearned+=Math.max(0,round2((IDX.col[b]||0)-sessVal))}
  z.outstanding=round2(out);z.unearned=round2(unearned);
  z.payoutsPaid=payoutsSum({doctor:f.doctor,from:f.from,to:f.to});
  z.owedAll=round2(doctorCompAll(f.doctor||null)-payoutsSum({doctor:f.doctor}));
  return z;
}
function doctorSummary(did){
  const prim=S.patients.filter(p=>p.doctorId===did);
  const ses=S.sessions.filter(s=>s.status==='active'&&s.doctorId===did&&IDX.pat.has(s.patientId));
  let comp=0,sub=0,own=0;for(const s of ses){comp+=sessionComp(s).doctor;const p=IDX.pat.get(s.patientId);if(p&&p.doctorId===did)own++;else sub++}
  const paid=payoutsSum({doctor:did});
  const cut45=addDaysS(todayISO(),-45),realP=prim.filter(p=>!p.examOnly);return{primary:realP.length,exams:prim.length-realP.length,primaryActive:realP.filter(p=>p.status==='active'&&(IDX.patSes[p.id]||[]).some(x=>x.status==='active'&&x.date>=cut45)).length,sessions:ses.length,own,sub,comp:round2(comp),paid,owed:round2(comp-paid)};
}
function monthName(k){const M=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];const p=k.split('-');return M[+p[1]-1]+' '+p[0]}
function appRowsFilter(f){f=f||{};return S.appointments.filter(a=>(!f.from||a.date>=f.from)&&(!f.to||a.date<=f.to)&&(!f.doctor||a.doctorId===f.doctor))}
const REPORTS=[
 {id:'docatt',title:'حضور الأطباء (ملخص)',filters:['range','doctor'],build(f){

    rows:docs.map(d=>{const l=(S.docAtt||[]).filter(x=>!x.pend&&x.doctorId===d.id&&x.date>=from&&x.date<=to);
      let ab=0;for(let dt=from,n=0;dt<=to&&n<400;dt=addDaysS(dt,1),n++)if(absenceOnDate(d.id,dt))ab++;
      const ins=l.filter(x=>x.in).map(x=>toMin(x.in)),outs=l.filter(x=>x.out).map(x=>toMin(x.out));

 {id:'monthpl',fin:true,title:'ملخص شهري: الدخل والمصروفات وأجور الأطباء',filters:['range'],build(f){
   const m=new Map();const g=k=>{if(!m.has(k))m.set(k,{cash:0,insta:0,exam:0,exp:0,doc:0});return m.get(k)};
   const inr=d=>!((f.from&&d<f.from)||(f.to&&d>f.to));
   for(const r of effDaily()){if(!inr(r.date))continue;const z=g(r.date.slice(0,7));z.cash+=r.cash;z.insta+=r.insta;z.exam+=r.exam;z.dn=1}
   for(const r of S.expenses||[]){if(!inr(r.date))continue;g(r.date.slice(0,7)).exp+=r.amount}
   if(!f.from&&!f.to)for(const o of S.monthly||[]){const z=m.get(o.m);if(z){z.cash=o.cash;z.insta=o.insta;z.exp=o.exp;z.exam=o.exam;z.official=1}}
   for(const s of S.sessions){if(s.status!=='active'||!IDX.pat.has(s.patientId)||!inr(s.date))continue;g(s.date.slice(0,7)).doc+=sessionComp(s).doctor}
   for(const t of S.ledger){if(t.status!=='received'||t.type!=='payment'||!inr(t.date))continue;const z=m.get(t.date.slice(0,7));if(z&&!z.dn){z.cash+=t.amount;z.fromLedger=1}}
   let T={cash:0,insta:0,exam:0,exp:0,doc:0};
   const rows=Array.from(m.keys()).sort().map(k=>{const z=m.get(k),inc=z.cash+z.insta;for(const q in T)T[q]+=z[q];return[monthName(k)+(z.fromLedger?' *':'')+(z.official?' (الشيت)':''),round2(z.cash),round2(z.insta),round2(inc),round2(z.exp),round2(z.doc),round2(inc-z.exp-z.doc),round2(z.exam)]});
   if(rows.length)rows.push(['الإجمالي',round2(T.cash),round2(T.insta),round2(T.cash+T.insta),round2(T.exp),round2(T.doc),round2(T.cash+T.insta-T.exp-T.doc),round2(T.exam)]);
   return{head:['الشهر','نقدًا','إنستاباي','إجمالي الإيراد','المصروفات','أجور الأطباء','صافي المركز بعد الأطباء','كشوفات د. بسمه (خارج الإيراد)'],rows}}},
 {id:'docmonth',fin:true,title:'ما استلمه كل دكتور شهريًا',filters:['range'],build(f){

    const CATS={att:'حضور وغياب الأطباء',pay:'الدفعات والمعاملات المالية',pat:'تسجيل وتعديل المرضى',apt:'المواعيد وحضور المرضى',exam:'الكشوفات',exp:'المصروفات',oth:'أخرى'};
    const catOf=a=>{const e=a.entity,s=a.summary||'';
      if(e==='doctor'&&/حضور|انصراف|غياب/.test(s))return'att';
      if(['payment','purchase','payout','bracepay'].includes(e))return'pay';
      if(e==='patient')return'pat';
      if(e==='appointment'||e==='session')return'apt';
      if(e==='exam')return'exam';if(e==='expense')return'exp';return'oth'};
    const day=(S.audit||[]).filter(a=>a.ts&&a.ts.slice(0,10)===f.date);
    const cnt={};day.forEach(a=>{const c=catOf(a);cnt[c]=(cnt[c]||0)+1});
    const list=day.filter(a=>!f.kind||catOf(a)===f.kind).slice().reverse();
    const summary='إجمالي تعديلات اليوم: '+day.length+(day.length?' — '+Object.keys(CATS).filter(k=>cnt[k]).map(k=>CATS[k]+': '+cnt[k]).join(' · '):'');
    return{summary,head:['الوقت','بواسطة','القسم','العملية','المريض','التغييرات','السبب'],
      rows:list.map(a=>{const p=a.patientId?IDX.pat.get(a.patientId):null;return[a.ts.slice(11,16),a.user||'',CATS[catOf(a)],a.summary||'',p?p.name:'',(a.changes||[]).map(c=>c.field+': '+c.from+' ← '+c.to).join(' | '),a.reason||'']})}}},
  {id:'audit',fin:true,title:'سجل التعديلات',filters:['range'],build(f){
   const rows=S.audit.filter(a=>(!f.from||a.ts.slice(0,10)>=f.from)&&(!f.to||a.ts.slice(0,10)<=f.to)).slice().reverse().map(a=>[a.ts.slice(0,16).replace('T',' '),a.user,a.entity,a.ref,a.summary,a.changes.map(c=>c.field+': '+c.from+' ← '+c.to).join(' | '),a.reason||'']);
   return{head:['التاريخ والوقت','بواسطة','النوع','المرجع','العملية','التغييرات','السبب'],rows}}}

function ghostAmt(d){
  const row=(S.daily||[]).find(x=>x.date===d)||{cash:0,insta:0};let sc=0,si=0;
  for(const t of S.ledger){if(t.date!==d||t.type!=='payment'||!(t.adj||SEED_TX.test(t.note||''))||(t.status!=='received'&&t.status!=='removed'))continue;if((t.method||'')===CASH_M)sc+=t.amount;else si+=t.amount}
  return{cash:round2((row.cash||0)-sc),insta:round2((row.insta||0)-si)};
}
function dayItems(d){
  const items=[];
  const txs=S.ledger.filter(t=>t.date===d&&IDX.pat.has(t.patientId)&&((t.type==='payment'&&!t.reversedBy&&t.status!=='removed')||t.type==='refund')).sort(cmpOrd);
  const sess=S.sessions.filter(s=>s.date===d&&s.status==='active'&&IDX.pat.has(s.patientId)).sort(cmpOrd);
  const first=new Map();
  for(const s of sess){const it={kind:'ses',ord:ordOf(s),id:s.id,s,pid:s.patientId,pays:[]};items.push(it);if(!first.has(s.patientId))first.set(s.patientId,it)}
  const po=new Map();
  for(const t of txs){const it=first.get(t.patientId)||po.get(t.patientId);if(it)it.pays.push(t);else{const n={kind:'pay',ord:ordOf(t),id:t.id,pid:t.patientId,pays:[t]};po.set(t.patientId,n);items.push(n)}}
  for(const e of S.exams||[])if(e.date===d)items.push({kind:'exm',ord:ordOf(e),id:e.id,e});
  for(const x of S.expenses||[])if(x.date===d)items.push({kind:'exp',ord:ordOf(x),id:x.id,x});
  for(const a of S.dayAdj||[])if(a.date===d)items.push({kind:'adj',ord:2e6,id:a.id,a});
  const g=ghostAmt(d);
  if(g.cash>0.005)items.push({kind:'ghost',ord:3e6,id:'g1',m:'cash',amt:g.cash});
  if(g.insta>0.005)items.push({kind:'ghost',ord:3e6+1,id:'g2',m:'insta',amt:g.insta});
  items.sort((a,b)=>a.ord!==b.ord?a.ord-b.ord:String(a.id)<String(b.id)?-1:1);
  return items;
}

   أرقام الإكسل القديمة (الصف "مبلغ غير مسجّل باسم مريض") مش داخلة في أي توتال. */
function dayTotalsFromRows(items){
  let cash=0,insta=0,exp=0,exm=0,ghost=0;
  const addPay=(m,a)=>{if((m||'')===CASH_M)cash+=a;else insta+=a};
  for(const it of items){
    if(it.kind==='ses'||it.kind==='pay'){for(const t of it.pays||[]){if(t.status==='received')addPay(t.method,t.amount)}}
    else if(it.kind==='adj')addPay(it.a.method,it.a.amount);
    else if(it.kind==='exp')exp+=it.x.amount;
    else if(it.kind==='exm')exm+=it.e.amount;
    else if(it.kind==='ghost')ghost+=it.amt;
  }
  return{cash:round2(cash),insta:round2(insta),expenses:round2(exp),exam:round2(exm),ghost:round2(ghost)};
}

function patientFilterList(){
  const f=UI.pat;
  return S.patients.filter(p=>{
    if(p.examOnly&&!f.q)return false;if(UI.view==='archived'){if(p.status!=='archived')return false}else if(p.status==='archived'&&!f.q)return false;
    if(f.q){const q=norm(f.q),raw=String(f.q).trim().toLowerCase();if(!(norm(p.name).includes(q)||p.id.toLowerCase().includes(raw)||(digitsOnly(f.q).length>=3&&digitsOnly(p.phone).includes(digitsOnly(f.q)))))return false}
    if(f.doctor&&p.doctorId!==f.doctor)return false;if(f.cat&&p.category!==f.cat)return false;if(f.status&&p.status!==f.status)return false;
    if(f.pay&&pdOf(p.id).status!==f.pay)return false;return true});
}
function sortPatients(list){
  const k=UI.pat.sort.key,d=UI.pat.sort.dir;
  const val=p=>{const x=pdOf(p.id);switch(k){case'id':return p.id;case'doctor':return docName(p.doctorId);case'category':return CAT_L[p.category];case'completed':return x.completed;case'remaining':return x.remaining==null?1e9:x.remaining;case'pay':return PSTAT_L[x.status];case'outstanding':return x.outstanding;case'status':return PAT_L[p.status];default:return p.name}};
  return list.slice().sort((a,b)=>{const x=val(a),y=val(b);let r=typeof x==='number'?x-y:String(x).localeCompare(String(y),'ar');return r*d||a.name.localeCompare(b.name,'ar')});
}

function monthGridHTML(ym,apps,o){
  o=o||{};const byDate={};for(const a of apps){(byDate[a.date]=byDate[a.date]||[]).push(a)}
  const first=ym+'-01',gridStart=startOfWeek(first),last=lastDayOfMonth(ym);const t=todayISO();
  let h='<div class="mgw"><div class="mg'+(o.compact?' cmp':'')+'">'+WEEK_ORDER.map(i=>'<div class="wh">'+WD[i]+'</div>').join('');
  let d=gridStart,rows=0;
  while(true){
    for(let i=0;i<7;i++){
      const inM=d.slice(0,7)===ym;const l=(byDate[d]||[]).sort((a,b)=>a.time<b.time?-1:1);const max=o.max||3;
      h+='<div class="mc'+(inM?'':' out')+(d===t?' today':'')+'">'+(o.onDay?'<button class="dn" data-act="calDay" data-date="'+d+'" title="فتح اليوم">'+(+d.slice(8))+'</button>':'<span class="dn">'+(+d.slice(8))+'</span>')+
      l.slice(0,max).map(a=>{const lab=o.byDoctor?shortDoc(docName(a.doctorId)):esc((IDX.pat.get(a.patientId)||{name:'—'}).name);
        return '<button class="ac s-'+a.status+(a.doctorId!==a.schedDoctorId?' is-sub':'')+'" data-act="openAppt" data-id="'+a.id+'" title="'+esc(tfmtT(a.time)+' · '+(IDX.pat.get(a.patientId)||{}).name+' · '+docName(a.doctorId)+' · '+APP_L[a.status])+'"><span class="n">'+tfmt(a.time)+'</span>'+lab+'</button>'}).join('')+
      (l.length>max?'<span class="more">+'+(l.length-max)+' أخرى</span>':'')+'</div>';
      d=addDaysS(d,1);
    }
    rows++;if(d>last||rows>=6)break;
  }
  return h+'</div></div>';
}

function submitForm(){
  const sp=UI.form,d=UI.draft;if(!sp)return;
  const errors={};let formErr='',warnings=[];
  for(const f of sp.fields(d)){if(!visible(f,d)||f.type==='html')continue;
    const v=d[f.k];const req=typeof f.req==='function'?f.req(d):f.req;
    if(req&&(f.type==='days'?!(v&&v.length):String(v==null?'':v).trim()===''))errors[f.k]='هذا الحقل مطلوب.';
    else if(f.type==='number'&&String(v).trim()!==''){const n=parseFloat(v);if(!isFinite(n))errors[f.k]='أدخل رقماً صحيحاً.';else if(f.min!=null&&n<f.min)errors[f.k]='القيمة يجب ألا تقل عن '+f.min+'.';else if(f.max!=null&&n>f.max)errors[f.k]='القيمة يجب ألا تزيد عن '+f.max+'.'}}
  if(!Object.keys(errors).length&&sp.validate){const r=sp.validate(d)||{};Object.assign(errors,r.errors||{});formErr=r.formErr||'';warnings=r.warnings||[]}
  UI.errors=errors;UI.formErr=formErr;

  if(warnings.length&&!(UI.ack&&JSON.stringify(warnings)===JSON.stringify(UI.warn))){UI.warn=warnings;UI.ack=true;renderModal();return}
  const r=sp.onSave(d);
  if(r&&r.error){UI.formErr=r.error;UI.ack=false;UI.warn=[];renderModal();return}
  const msg=r&&r.msg;closeModal();if(msg)toast(msg,r.kind);refresh();
}

      return{msg:r.nochange?'لا توجد تغييرات.':r.msg};
    }});

  const targets=purs.map(u=>({v:u.id,l:u.id+' · '+u.name+' · متبقٍ '+nfmt(IDX.pu[u.id].out)+' EGP'}));
  if(p.category==='persession')targets.push({v:'pps',l:'الدفع بالجلسة (مستحق '+nfmt(Math.max(0,pdOf(pid).outstanding-purs.reduce((a,u)=>a+IDX.pu[u.id].out,0)))+' EGP)'});
  if(!targets.length){const lu=(IDX.patPur[pid]||[]).filter(u=>u.status==='active'&&!u.settled).slice(-1)[0];targets.push(lu?{v:lu.id,l:lu.id+' · '+lu.name}:{v:'pps',l:'دفعة على حساب المريض'})}
  const tg=puId&&targets.some(t=>t.v===puId)?puId:targets[0].v;
  openForm({title:'تسجيل دفعة — '+p.name,submit:'تسجيل الدفعة',draft:{target:tg,amount:'',date:todayISO(),method:METHODS[0],status:'received',note:''},
    fields:d=>[{k:'target',label:'الدفعة على',type:'select',options:targets,full:true},{k:'amount',label:'المبلغ (EGP)',type:'number',min:0,step:50,req:true},{k:'date',label:'تاريخ الدفع',type:'date',req:true},
      {k:'method',label:'طريقة الدفع',type:'select',options:METHODS.map(m=>({v:m,l:m}))},{k:'status',label:'حالة الدفع',type:'select',options:[{v:'received',l:'مستلمة'},{v:'pending',l:'بانتظار الاستلام (لا تُحسب إيراداً)'}]},{k:'note',label:'ملاحظة',type:'text',full:true}],
    info:d=>{const u=IDX.pur.get(d.target);const out=u?IDX.pu[u.id].out:Math.max(0,pdOf(pid).outstanding);return pkgNote(pid,u)+'<div class="note">المتبقي حالياً: <b>'+moneyT(out)+'</b>'+(num(d.amount)>0?' · بعد هذه الدفعة: <b>'+moneyT(Math.max(0,out-(d.status==='received'?num(d.amount):0)))+'</b>':'')+'. الدفعة تُسجَّل كمعاملة مستقلة ولا تُعدّل أي معاملة سابقة.</div>'},
    onSave(d){const r=addPayment({patientId:pid,purchaseId:d.target==='pps'?null:d.target,amount:d.amount,date:d.date,method:d.method,status:d.status,note:d.note});return r.ok?{msg:r.msg}:{error:r.error}}});
}
function openCorrectPay(tid){
  const t=IDX.tx.get(tid);if(!t)return;
  askReason({title:'تصحيح دفعة '+t.id,intro:'يُسجَّل عكس للدفعة الأصلية ثم دفعة جديدة بالقيم الصحيحة. تبقى الدفعة الأصلية ظاهرة في السجل ولا تُحذف.',label:'حفظ التصحيح',
    draft:{amount:t.amount,date:t.date,method:t.method},fields:()=>[{k:'amount',label:'المبلغ الصحيح (EGP)',type:'number',min:0,step:50,req:true},{k:'date',label:'التاريخ الصحيح',type:'date',req:true},{k:'method',label:'طريقة الدفع',type:'select',options:METHODS.map(m=>({v:m,l:m}))}],
    info:d=>{const diff=num(d.amount)-t.amount;const pd=pdOf(t.patientId);return '<div class="note">الأثر: المحصّل من المريض يتغير بمقدار <b>'+(diff>=0?'+':'')+nfmt(diff)+' EGP</b> ← المتبقي عليه يصبح <b>'+moneyT(Math.max(0,pd.outstanding-diff))+'</b>. قد تتغير أجور الأطباء للجلسات المرتبطة بهذه الدفعة.</div>'},
    onYes:(reason,d)=>{const r=correctPayment(tid,{amount:d.amount,date:d.date,method:d.method},reason);return r.ok?{msg:r.msg}:{error:r.error}}});

function openRefund(uid){
  const u=IDX.pur.get(uid),x=IDX.pu[uid];let consumed=0;for(const s of S.sessions)if(s.status==='active'&&s.purchaseId===uid)consumed+=s.value;
  const sug=Math.max(0,round2(x.col-consumed));
  askReason({title:'استرداد / إغلاق باقة — '+u.name,intro:'المحصّل '+moneyT(x.col)+' · قيمة الجلسات المنفذة '+moneyT(round2(consumed))+'. يُسجَّل الاسترداد كمعاملة مستقلة سالبة.',label:'تسجيل الاسترداد',danger:true,reasonLabel:'سبب الاسترداد',
    draft:{amount:sug,close:true,date:todayISO(),method:METHODS[0]},
    fields:()=>[{k:'amount',label:'مبلغ الاسترداد (EGP)',type:'number',min:0,step:50,req:true,hint:'المقترح: غير المستهلك من المحصّل.'},{k:'date',label:'التاريخ',type:'date',req:true},{k:'method',label:'طريقة الاسترداد',type:'select',options:METHODS.map(m=>({v:m,l:m}))},{k:'close',label:'إغلاق الباقة وإلغاء الجلسات المتبقية',type:'checkbox',full:true}],
    info:d=>{const amt=num(d.amount),after=round2(x.col-amt);let h='<div class="note">المحصّل بعد الاسترداد: <b>'+moneyT(after)+'</b>.';if(after<consumed-0.001)h+=' <b>تنبيه:</b> سيقل المحصّل عن قيمة الجلسات المنفذة، فيتراجع أجر الطبيب عن جزء منها (حتى '+moneyT(round2((consumed-after)*S.settings.rate))+').';return h+'</div>'},
    onYes:(reason,d)=>{const r=refundPurchase(uid,{amount:d.amount,close:d.close,date:d.date,method:d.method,reason});return r.ok?{msg:r.msg}:{error:r.error}}});
}
function openAdjustPurchase(uid){
  const u=IDX.pur.get(uid),x=IDX.pu[uid];
  askReason({title:'تعديل مشتراة '+u.id,intro:'تعديل استثنائي معتمد. لا يتغير السعر المحفوظ في المشتريات الأخرى، وتحتفظ الجلسات المنفذة بقيمتها وقت تنفيذها.',label:'اعتماد التعديل',reasonLabel:'سبب التعديل',

/* ---------- calendar ---------- */
function calApps(from,to){return S.appointments.filter(a=>a.status!=='cancelled'&&a.date>=from&&a.date<=to&&(!UI.cal.doctor||a.doctorId===UI.cal.doctor)&&(!UI.cal.status||a.status===UI.cal.status))}
function calTitle(){const c=UI.cal;
  if(c.view==='day')return dlong(c.date);
  if(c.view==='week'){const s=startOfWeek(c.date);return dfmtT(s)+' → '+dfmtT(addDaysS(s,6))}
  return monthLabel(c.date.slice(0,7))}
function chipRO(a,lab){const p=IDX.pat.get(a.patientId);return '<span class="ac s-'+a.status+'" title="'+esc(tfmtT(a.time)+' · '+(p?p.name:'')+' · '+docName(a.doctorId))+'">'+(a.confirmed?'✓ ':'')+lab+'</span>'}
function owedOf(pid){return canDo('pay')?Math.round(pdOf(pid).outstanding||0):0}
function owedChip(pid){const o=owedOf(pid);return o>0?' <span class="b unpaid" title="متأخرات على المريض">متأخر '+nfmt(o)+' ج</span>':''}
function pubFor(did,date){return !!(((S.pubD||{})[date+'|'+did])||((S.pub||{})[date]))}

  h+='<div class="seg" role="group" aria-label="الأطباء" style="flex-wrap:wrap;margin:8px 0">'+docs.map(d=>'<button data-act="wkDoc" data-id="'+d.id+'" aria-pressed="'+(d.id===w.doc)+'">'+esc(shortDoc(d.name))+' <span class="muted sm-t">'+(cnt[d.id]||0)+'</span></button>').join('')+'</div>';
  h+='<div class="acts" style="margin:6px 0"><b>'+esc(doc.name)+'</b><span class="muted"> · مثبّت للدكتور: '+nPub+' من 7 أيام</span><button class="btn'+(nPub<7?' primary':'')+'" data-act="wkPub">'+(nPub<7?'تثبيت جدول الأسبوع للدكتور':'إلغاء تثبيت الأسبوع')+'</button><button class="btn" data-act="wkRepeat" title="ينسخ مواعيد هذا الأسبوع لهذا الدكتور على الأسابيع التالية">تكرار هذا الجدول على الأسابيع القادمة</button></div>';
  const hasExtra=Object.keys(extra).length>0;
  h+='<div class="cgw"><table class="cg"><thead><tr><th class="tc">اليوم</th>'+slots.map(tm=>'<th>'+tfmt(tm)+'</th>').join('')+(hasExtra?'<th>خارج الساعات</th>':'')+'</tr></thead><tbody>';
  days.forEach(d=>{h+='<tr><td class="tc'+(d===t?' today':'')+'"><b>'+WD[weekday(d)]+'</b><br>'+dfmt(d).replace(/\/\d{4}<\/span>/,'</span>')+'<br><button class="btn sm" data-act="wkPubDay" data-date="'+d+'">'+(pubFor(w.doc,d)?'✓ مثبّت':'تثبيت')+'</button></td>'+slots.map((tm,i)=>{const l=(cell[d+'|'+i]||[]).sort((x,y)=>x.time<y.time?-1:1);const av=doctorAvail(w.doc,d,tm,step);
    return '<td class="'+(av.ok?'add':'na add')+'" data-act="newApptCell" data-date="'+d+'" data-time="'+tm+'" data-doc="'+w.doc+'" title="'+(av.ok?(l.length?'إضافة موعد آخر في نفس الوقت':'حجز موعد'):esc('حجز رغم عدم التوفر: '+av.reason))+'">'+l.map(x=>chipHTML(x,lbl(x))).join('')+'</td>'}).join('')+(hasExtra?'<td class="nowr">'+((extra[d+'|x']||[]).map(x=>chipHTML(x,'<span class="n">'+tfmt(x.time)+'</span> '+lbl(x))).join(''))+'</td>':'')+'</tr>'});

  const pids=[...new Set(apps.map(a=>a.patientId))];
  const rows=pids.map(id=>({id,owed:owedOf(id),n:apps.filter(a=>a.patientId===id).length})).filter(r=>r.owed>0).sort((a,b)=>b.owed-a.owed);

  return h;
}
function chipHTML(a,lab){const p=IDX.pat.get(a.patientId);lab=(a.confirmed&&a.status==='scheduled'?'✓ ':'')+lab;return '<button class="ac s-'+a.status+(a.doctorId!==a.schedDoctorId?' is-sub':'')+'" data-act="openAppt" data-id="'+a.id+'" title="'+esc(tfmtT(a.time)+' · '+(p?p.name:'')+' · '+docName(a.doctorId)+(a.doctorId!==(p||{}).doctorId?' (بديل)':'')+' · '+APP_L[a.status])+'">'+lab+'</button>'}
function weekGridHTML(date){
  const s=startOfWeek(date),days=[0,1,2,3,4,5,6].map(i=>addDaysS(s,i));const apps=calApps(days[0],days[6]);

function effDaily(){/* كل الأرقام اليومية/الشهرية بتتجمع من الصفوف المسجّلة فعلاً، مش من أرقام الإكسل */
  const by=new Map(),get=d=>{let r=by.get(d);if(!r){r={date:d,cash:0,insta:0,expenses:0,exam:0};by.set(d,r)}return r};
  for(const t of S.ledger||[]){if(t.status!=='received'||t.reversedBy||t.type==='reversal'||(t.type!=='payment'&&t.type!=='refund'))continue;if(!IDX.pat.has(t.patientId))continue;const r=get(t.date);if((t.method||'')===CASH_M)r.cash+=t.amount;else r.insta+=t.amount}
  for(const a of S.dayAdj||[]){const r=get(a.date);if((a.method||'')===CASH_M)r.cash+=a.amount;else r.insta+=a.amount}
  for(const e of S.expenses||[])get(e.date).expenses+=e.amount;
  for(const e of S.exams||[])get(e.date).exam+=e.amount;
  return Array.from(by.values()).map(r=>({date:r.date,cash:round2(r.cash),insta:round2(r.insta),expenses:round2(r.expenses),exam:round2(r.exam)}))}

function mergePatients(ids,keepId,newName,reason){need('admin');
  const nm=String(newName||'').trim();if(!nm)return{ok:false,error:'اكتب الاسم النهائي.'};
  const list=ids.map(id=>S.patients.find(x=>x.id===id)).filter(Boolean);
  if(list.length<2)return{ok:false,error:'اختر مريضين على الأقل.'};
  const keep=list.find(p=>p.id===keepId)||list[0],others=list.filter(p=>p.id!==keep.id),oid=new Set(others.map(p=>p.id));
  ['appointments','sessions','ledger','purchases','audit','braces','exams'].forEach(k=>(S[k]||[]).forEach(a=>{if(oid.has(a.patientId))a.patientId=keep.id}));
  const old=keep.name;
  for(const o of others){if(!keep.phone&&o.phone)keep.phone=o.phone;if(o.notes&&!(keep.notes||'').includes(o.notes))keep.notes=(keep.notes||'')+(keep.notes?' — ':'')+o.notes;if(o.startDate&&(!keep.startDate||o.startDate<keep.startDate))keep.startDate=o.startDate;if(o.createdAt&&(!keep.createdAt||o.createdAt<keep.createdAt))keep.createdAt=o.createdAt}
  if(keep.status==='archived'&&others.some(o=>o.status!=='archived'))keep.status='active';
  keep.name=nm;S.patients=S.patients.filter(p=>!oid.has(p.id));
  logA('patient',keep.id,'دمج مرضى: '+list.map(p=>p.name+' ('+p.id+')').join(' + ')+' ← '+nm,[{field:'الاسم',from:old,to:nm}],reason||'',keep.id);
  commit();return{ok:true,msg:'تم دمج '+list.length+' مرضى في «'+nm+'».'};
}
function simGroups(){
  const key=S.patients.length+'|'+S.patients.reduce((a,p)=>a+p.name.length,0);
  if(simGroups._k===key)return simGroups._v;
  const lev=(a,b)=>{const m=a.length,n=b.length;if(!m||!n)return 0;let pr=[];for(let j=0;j<=n;j++)pr[j]=j;for(let i=1;i<=m;i++){const cu=[i];for(let j=1;j<=n;j++)cu[j]=Math.min(pr[j]+1,cu[j-1]+1,pr[j-1]+(a[i-1]===b[j-1]?0:1));pr=cu}return 1-pr[n]/Math.max(m,n)};
  const P=S.patients.map(p=>{const t=norm(p.name).replace(/عبد /g,'عبد').replace(/ابو /g,'ابو').split(' ').filter(Boolean).map(x=>x.length>4&&x.startsWith('ال')?x.slice(2):x);return{p,t,j:t.join('')}});
  const freq={};P.forEach(x=>new Set(x.t).forEach(w=>freq[w]=(freq[w]||0)+1));
  const eq=(x,y)=>x===y||(x.length>=5&&y.length>=5&&lev(x,y)>=0.85);
  const sub=(a,b)=>{const s=a.t.length<=b.t.length?a:b,l=s===a?b:a;return s.t.every(x=>l.t.some(y=>eq(x,y)))};
  const hub=new Set();
  P.forEach((a,i)=>{let c=0;P.forEach((b,j)=>{if(i!==j&&a.t.length<b.t.length&&sub(a,b))c++});if(c>3)hub.add(i)});
  const par=P.map((_,i)=>i),f=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x};
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];if(!a.t.length||!b.t.length)continue;
    const same=a.t.length===b.t.length&&[...a.t].sort().join(' ')===[...b.t].sort().join(' ');
    let ok=same;
    if(!ok&&!hub.has(i)&&!hub.has(j)){
      if(a.j.slice(0,3)===b.j.slice(0,3)&&lev(a.j,b.j)>=0.86)ok=true;
      else if(sub(a,b)){const s=a.t.length<=b.t.length?a:b;if(s.t.length>=2)ok=true;else if(freq[s.t[0]]<=3&&s.t[0].length>=4)ok=true}
    }
    if(ok)par[f(i)]=f(j)}
  const G={};P.forEach((x,i)=>{(G[f(i)]=G[f(i)]||[]).push(x.p)});
  const v=Object.values(G).filter(g=>g.length>1&&g.length<=12).sort((a,b)=>a[0].name<b[0].name?-1:1);
  simGroups._k=key;simGroups._v=v;return v;
}

function confirmPartInfo(p){
  if(!p||p.category!=='package'||p.status==='archived')return null;
  if((S.scissorsRemoved||[]).some(r=>r.patientId===p.id))return null;
  const d=pdOf(p.id),v=pkgView(p),rem=v?v.rem:d.remaining;
  const cc=v?IDX.pu[v.cur.id].col:d.collected,oo=v?IDX.pu[v.cur.id].out:d.outstanding;
  if(!(cc>0)||!(oo>0)||!(rem>0))return null;
  const ses=(IDX.patSes[p.id]||[]).filter(s=>s.status==='active').map(s=>s.date).sort();
  if(!ses.length)return null;const last=ses[ses.length-1],gap=daysBetween(last,todayISO());
  if(gap<=30)return null;
  return{d,last,gap,total:v?v.total:d.total,done:v?v.used:d.completed,rem,col:v?IDX.pu[v.cur.id].col:d.collected,left:v?IDX.pu[v.cur.id].out:d.outstanding}
}

function debtInfo(p){

    show.map(r=>'<tr class="'+(r.status==='معكوسة'?'r-can':'')+'"><td class="n">'+r.id+'</td><td>'+dfmt(r.date)+(r.time?' '+tfmt(r.time):'')+'</td><td><button class="link" data-act="openPanel" data-id="'+r.patientId+'">'+esc(patName(r.patientId))+'</button><span class="idc">'+r.patientId+'</span></td><td>'+TX_L[r.type]+'</td><td class="c">'+(r.kind==='tx'?money(r.cash):'—')+'</td><td class="c">'+(r.basis==null?'—':money(r.basis)+(r.rate?' <span class="muted sm-t">× '+Math.round(r.rate*100)+'%</span>':''))+'</td><td class="c">'+(r.doctorComp==null?'—':money(r.doctorComp))+'</td><td class="c">'+(r.center==null?'—':money(r.center))+'</td><td>'+(r.doctorId?esc(docName(r.doctorId)):'—')+'</td><td>'+esc(r.method||'—')+'</td><td>'+esc(r.status)+'</td><td class="notes" style="max-width:260px" title="'+esc(r.related+' '+r.note)+'">'+esc(r.related)+(r.note?' · '+esc(r.note):'')+'</td></tr>').join('')+'</tbody></table></div>':empty('لا توجد حركات مطابقة','غيّر التصفية أو سجّل مدفوعات وجلسات.'))+'</section>';

}

/* ---------- reports ---------- */
function reportsHTML(){
  const VR=visibleReports();const r=VR.find(x=>x.id===UI.rep.id)||VR[0],f=UI.rep;
  const out=runReport(r.id,f);
  let h='<div class="page-head"><div><h1>التقارير</h1><p class="muted">اختر تقريراً، حدّد التصفية، ثم صدّره. التصدير يطابق ما تراه في الجدول.</p></div><div class="acts"><button class="btn" data-act="expRep">'+ic('down')+' تصدير CSV</button></div></div>';
  h+='<div class="rep-sel">'+VR.map(x=>'<button data-act="repPick" data-id="'+x.id+'" aria-pressed="'+(x.id===r.id)+'">'+x.title+'</button>').join('')+'</div>';
  h+='<section class="card"><h2>'+r.title+'</h2><div class="toolbar">'+
    (r.filters.includes('date')?'<label class="fld"><span class="hint">اليوم</span><input class="inp" type="date" data-ch="rep" data-k="date" id="rep-date" value="'+f.date+'"></label>':'')+
    (r.filters.includes('range')?'<label class="fld"><span class="hint">من تاريخ</span><input class="inp" type="date" data-ch="rep" data-k="from" id="rep-from" value="'+f.from+'"></label><label class="fld"><span class="hint">إلى تاريخ</span><input class="inp" type="date" data-ch="rep" data-k="to" id="rep-to" value="'+f.to+'"></label>':'')+
    (r.filters.includes('doctor')?'<label class="fld"><span class="hint">الطبيب</span><select class="sel" data-ch="rep" data-k="doctor" id="rep-doctor"><option value="">كل الأطباء</option>'+S.doctors.map(d=>'<option value="'+d.id+'"'+(f.doctor===d.id?' selected':'')+'>'+esc(d.name)+'</option>').join('')+'</select></label>':'')+
    (r.filters.includes('kind')?'<label class="fld"><span class="hint">القسم</span><select class="sel" data-ch="rep" data-k="kind" id="rep-kind">'+[['','كل الأقسام'],['att','حضور وغياب الأطباء'],['pay','الدفعات والمعاملات المالية'],['pat','تسجيل وتعديل المرضى'],['apt','المواعيد وحضور المرضى'],['exam','الكشوفات'],['exp','المصروفات'],['oth','أخرى']].map(o=>'<option value="'+o[0]+'"'+((f.kind||'')===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label>':'')+'<button class="btn" data-act="clearRep" style="align-self:flex-end">مسح</button></div>';
  h+=(out.summary?'<p class="hint"><b>'+esc(out.summary)+'</b></p>':'');   h+=out.rows.length?'<p class="hint">'+out.rows.length+' صف</p><div class="tw"><table class="xl tight" style="min-width:'+Math.max(640,out.head.length*130)+'px"><thead><tr>'+out.head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
    out.rows.slice(0,500).map(row=>'<tr>'+row.map(v=>'<td'+(typeof v==='number'?' class="num"':'')+'>'+(typeof v==='number'?'<span class="n">'+nfmt(v)+'</span>':esc(v))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(out.rows.length>500?'<p class="pagenote">يعرض أول 500 صف. التصدير يشمل الكل.</p>':''):empty('لا توجد بيانات لهذا التقرير','غيّر التصفية أو التاريخ.');
  if(r.id==='scissorsRemoved'&&(S.scissorsRemoved||[]).length)h+='<div class="mf" style="padding:8px 0;flex-wrap:wrap">'+S.scissorsRemoved.map(x=>{const p=IDX.pat.get(x.patientId);return '<button class="btn sm" data-act="scissorsRestore" data-id="'+x.patientId+'">إرجاع '+esc(p?p.name:x.patientId)+'</button>'}).join('')+'</div>';
  return h+'</section>';
}

/* ---------- settings ---------- */
function settingsHTML(){
  const s=S.settings,demoP=S.patients.filter(p=>p.demo).length,realP=S.patients.length-demoP,fr=s.free;
  const dayBox=(i)=>'<label><input type="checkbox" data-sd="'+i+'"'+(s.workDays.includes(i)?' checked':'')+'> '+WD[i]+'</label>';
  if(!canDo('admin'))return '<div class="page-head"><div><h1>حسابي</h1></div></div>'+myAccountCard();
  return '<div class="page-head"><div><h1>الإعدادات</h1></div></div>'+
  '<div class="note warn"><b>تنبيه أمان:</b> هذا نموذج تجريبي يعمل داخل المتصفح ويحفظ البيانات على هذا الجهاز فقط، وليس نظاماً آمناً لبيانات المرضى الحقيقية. للاستخدام الفعلي يلزم تسجيل دخول وصلاحيات حسب الدور وقاعدة بيانات مؤمّنة ونسخ احتياطي منتظم.</div>'+
  '<section class="card"><h2>بيانات المركز</h2><div class="fg"><label class="fld"><span class="lbl">اسم المركز</span><input class="inp" id="set-center" value="'+esc(S.center)+'" maxlength="60"></label></div><div><button class="btn primary" data-act="saveCenter">حفظ</button></div></section>'+
  '<section class="card"><h2>ساعات العمل والمواعيد</h2><div class="fg"><label class="fld"><span class="lbl">بداية الدوام</span><input class="inp" type="time" id="set-start" value="'+s.hours.start+'"></label><label class="fld"><span class="lbl">نهاية الدوام</span><input class="inp" type="time" id="set-end" value="'+s.hours.end+'"></label>'+
  '<label class="fld"><span class="lbl">مدة الموعد / الفترة الثابتة (دقيقة)</span><input class="inp" type="number" id="set-slot" min="15" step="5" value="'+s.slot+'"></label><div class="fld full"><span class="lbl">أيام العمل الافتراضية</span><div class="days">'+WEEK_ORDER.map(dayBox).join('')+'</div><span class="hint">تُستخدم للأطباء الجدد. لكل طبيب أيام وساعات خاصة به من صفحته.</span></div></div>'+
  '<div class="note">تغيير مدة الفترة أو الساعات لا يغيّر المواعيد الموجودة، ويؤثر على الفترات المعروضة في الحجز الجديد.</div><div><button class="btn primary" data-act="saveHours">حفظ</button></div></section>'+
  
  '<section class="card"><h2>نسخة احتياطية واستعادة</h2><p class="muted">صدّر كل البيانات كملف JSON واحفظه في مكان آمن، أو استعد نسخة سابقة. الاستعادة تستبدل البيانات الحالية.</p><div class="mf"><button class="btn" data-act="expBackup">'+ic('down',16)+' تصدير نسخة احتياطية</button><button class="btn" data-act="impBackup">استعادة من نسخة</button></div></section>'+
  '<section class="card"><h2>البيانات التجريبية والفعلية</h2><div class="mini"><div>مرضى تجريبيون<b>'+demoP+'</b></div><div>مرضى فعليون<b>'+realP+'</b></div></div><p class="muted">المرضى التجريبيون عليهم علامة «تجريبي». حذف التجريبي لا يمس المرضى الذين أضفتهم أنت ولا الأطباء والباقات.</p>'+
  '<div class="mf"><button class="btn danger" data-act="removeDemo">حذف البيانات التجريبية فقط</button><button class="btn danger" data-act="resetAll">إعادة تحميل بيانات المركز الأصلية</button></div></section>'+
  '<section class="card"><h2>التخزين</h2><p>'+(SAVE_OK?'<span class="b paid">التخزين يعمل</span>':'<span class="b unpaid">التخزين غير متاح في هذا المتصفح</span>')+'</p><p class="muted">الإصدار 2 · '+S.patients.length+' مريض · '+S.appointments.length+' موعد · '+S.sessions.length+' جلسة · '+S.ledger.length+' معاملة · '+S.audit.length+' تعديل مسجل.</p></section>'+usersCard();
}

/* ---------- patient notes: illness / absence / attendance / money ---------- */
const NCAT={illness:'المرض / الحالة',absence:'الغياب',attendance:'الحضور',money:'المالية'};
function noteCats(){return Object.keys(NCAT).filter(k=>k!=='money'||isFin())}
function patientNotes(p){return (p.noteLog||[]).filter(n=>n.cat!=='money'||isFin()).slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:a.ts<b.ts?1:-1)}
function patientNotesHTML(p){
  const all=patientNotes(p),cat=(UI.panel&&UI.panel.ncat)||'',list=cat?all.filter(n=>n.cat===cat):all;
  const cnt=k=>all.filter(n=>n.cat===k).length;
  let h='<div class="psec" id="pnotes"><h3><span>ملاحظات المريض ('+all.length+')</span><button class="btn sm primary" data-act="addPNote" data-id="'+p.id+'">'+ic('plus',14)+' إضافة ملاحظة</button></h3>';
  h+='<div class="nfilter"><button class="tab sm" data-act="pNoteCat" data-c="" aria-selected="'+(!cat)+'">الكل ('+all.length+')</button>'+noteCats().map(k=>'<button class="tab sm" data-act="pNoteCat" data-c="'+k+'" aria-selected="'+(cat===k)+'">'+NCAT[k]+' ('+cnt(k)+')</button>').join('')+'</div>';
  h+=list.length?'<ul class="list">'+list.map(n=>'<li><span class="m"><b><span class="nc '+n.cat+'">'+NCAT[n.cat]+'</span> '+dfmt(n.date)+'</b><span class="ntext">'+esc(n.text)+'</span><span class="muted sm-t">'+esc(n.user||'')+(n.edited?' · عُدّلت':'')+'</span></span><span class="mf"><button class="ib" data-act="editPNote" data-id="'+p.id+'" data-nid="'+n.id+'" title="تعديل" aria-label="تعديل الملاحظة">'+ic('edit',16)+'</button><button class="ib del" data-act="delPNote" data-id="'+p.id+'" data-nid="'+n.id+'" title="حذف" aria-label="حذف الملاحظة">'+ic('trash',16)+'</button></span></li>').join('')+'</ul>':'<p class="hint">لا توجد ملاحظات'+(cat?' في هذا القسم':'')+' بعد. اضغط «إضافة ملاحظة» لتسجيل المرض أو الغياب أو الحضور'+(isFin()?' أو المالية':'')+'.</p>';

function hoursTxt(a,b){const m=toMin(b)-toMin(a);return m>0?Math.floor(m/60)+' س '+(m%60)+' د':''}
function presSide(){return CUR&&CUR.role==='doctor'?'doc':CUR&&CUR.role==='reception'?'sec':'both'}
function presApply(r,side,inT,outT){
  if(r.in&&!r.dIn&&!r.sIn){r.dIn=r.sIn=r.in;if(r.out){r.dOut=r.sOut=r.out}}
  const first=side!=='both';
  if(inT){if(!(first&&(r.dIn||r.sIn)))r.dIn=r.sIn=inT}
  if(outT){if(!(first&&(r.dOut||r.sOut)))r.dOut=r.sOut=outT}
  r.pend=!(r.dIn||r.sIn);r.in=r.dIn||r.sIn||'';r.out=r.dOut||r.sOut||'';
}
function presenceOf(did,date){return (S.docAtt||[]).find(x=>x.doctorId===did&&x.date===date)||null}
function absenceOnDate(did,date){return S.absences.find(x=>x.doctorId===did&&x.date<=date&&date<=(x.dateTo||x.date))||null}
function addPresence(d){
  if(!Array.isArray(S.docAtt))S.docAtt=[];const side=presSide();
  let ex=presenceOf(d.doctorId,d.date),isNew=!ex;
  if(!ex){ex={id:nid('da'),doctorId:d.doctorId,date:d.date,in:'',out:'',note:'',user:ACTOR,ts:nowISO(),pend:true};S.docAtt.push(ex)}
  presApply(ex,side,d.in||'',d.out?d.out:undefined);
  if(d.note!==undefined)ex.note=(d.note||'').trim();
  logA('doctor',d.doctorId,(isNew?'تسجيل حضور ':'تعديل حضور ')+docName(d.doctorId)+(side==='doc'?' (من الطبيب)':side==='sec'?' (من السكرتارية)':'')+(ex.pend?' — بانتظار التأكيد من الطرف الآخر':''),[{field:'التاريخ',from:isNew?'':ex.date,to:ex.date+(d.in?' '+d.in:'')}],ex.note);commit();return ex;
}
function removePresence(id){const i=(S.docAtt||[]).findIndex(x=>x.id===id);if(i<0)return;const r=S.docAtt[i];S.docAtt.splice(i,1);
  logA('doctor',r.doctorId,'حذف تسجيل حضور',[{field:'التاريخ',from:r.date,to:'محذوف'}]);commit()}
function docDayState(d,date){
  const pr=presenceOf(d.id,date),ab=absenceOnDate(d.id,date);
  if(pr&&pr.pend)return{k:'pending',l:pr.dIn&&!pr.sIn?'بانتظار تأكيد السكرتارية':'بانتظار تأكيد الطبيب',pr};

function caseRate(p,did){return p&&p.docRate!=null&&isFinite(p.docRate)&&p.docRate>=0&&p.docRate<=1?p.docRate:docRate(did)}
function applyCaseRate(pid,pct,from,reason){
  need('admin');
  const p=S.patients.find(x=>x.id===pid);if(!p)return{ok:false,error:'المريض غير موجود.'};
  const raw=String(pct==null?'':pct).trim();let nr=null;
  if(raw!==''){const v=parseFloat(raw);if(!isFinite(v)||v<0||v>100)return{ok:false,error:'النسبة لازم تكون بين 0 و 100.'};nr=v/100}
  if(from&&!validDate(from))return{ok:false,error:'التاريخ غير صحيح.'};
  const old=p.docRate!=null?p.docRate:null;
  if(nr==null)delete p.docRate;else p.docRate=nr;
  let n=0;
  if(from){for(const s of S.sessions){if(s.patientId!==pid||s.status!=='active'||s.date<from)continue;const r=nr!=null?nr:docRate(s.doctorId);if(s.rate!==r){s.rate=r;n++}}}
  const f=x=>x==null?'النسبة الافتراضية':Math.round(x*10000)/100+'%';
  if(old!==nr||n)logA('patient',pid,'تعديل نسبة الدكتور للحالة',[{field:'نسبة الدكتور',from:f(old),to:f(nr)}].concat(n?[{field:'جلسات سابقة اتعدلت',from:'',to:String(n)}]:[]),reason||'',pid);
  commit();
  return{ok:true,n,msg:'تم حفظ نسبة الدكتور للحالة'+(nr==null?' (رجعت للنسبة الافتراضية)':'')+(n?' وتعديل '+n+' جلسة سابقة.':' (تسري على الجلسات القادمة).')};
}

function setPurchasePrice(uid,price,reason){
  if(!(isFin()||canDo('pkg')))throw new Error(DENY);
  const u=S.purchases.find(x=>x.id===uid);if(!u)return{ok:false,error:'الباقة غير موجودة.'};
  const x=IDX.pu[uid]||{col:0,used:0};
  if(!isFin()&&!(u.date===todayISO()||(x.used===0&&x.col===0)))return{ok:false,error:'هذه الباقة قديمة أو سبق تحصيل مبالغ عليها. تعديل سعرها من صلاحية المدير.'};
  const np=num(price);if(!(np>0))return{ok:false,error:'السعر لازم يكون أكبر من صفر.'};
  if(np<x.col)return{ok:false,error:'السعر أقل من المحصّل ('+nfmt(x.col)+').'};

/* ---------- remove / restore payment ---------- */
function removeTx(id,reason){
  need('admin');const t=S.ledger.find(x=>x.id===id);
  if(!t||t.status==='removed')return{ok:false,error:'الدفعة غير موجودة.'};
  if(t.type!=='payment'||t.reversedBy)return{ok:false,error:'تعذر إزالة هذه الحركة.'};
  t.prevStatus=t.status;t.status='removed';t.removedAt=nowISO();t.removedBy=ACTOR;t.removeReason=reason||'';
  logA('payment',id,'إزالة دفعة',[{field:'المبلغ',from:String(t.amount),to:'0 (محذوفة)'},{field:'التاريخ',from:t.date,to:''}],reason||'',t.patientId);
  commit();return{ok:true,msg:'تمت إزالة الدفعة من كل الحسابات.'};
}
function restoreTx(id){
  need('admin');const t=S.ledger.find(x=>x.id===id);
  if(!t||t.status!=='removed')return{ok:false,error:'الدفعة غير محذوفة.'};
  t.status=t.prevStatus||'received';delete t.prevStatus;delete t.removedAt;delete t.removedBy;delete t.removeReason;
  logA('payment',id,'استرجاع دفعة محذوفة',[{field:'المبلغ',from:'0',to:String(t.amount)}],'',t.patientId);
  commit();return{ok:true,msg:'تم استرجاع الدفعة.'};
}

  function splitId(id){const m=/^(\D+?)(\d+)$/.exec(String(id));return m?{p:m[1],n:+m[2],w:m[2].length,z:m[2][0]==='0'}:null}
  function mergeObj(b,l,r){
    const ctx={conf:0,lost:[],loc:new Set(),pend:[],remap:0};
    const out={};
    const keys=new Set(Object.keys(r).concat(Object.keys(l)));
    for(const k of keys){
      const bv=b?b[k]:undefined,lv=l[k],rv=r[k];
      let v;

      else if(k==='seq'&&lv&&rv&&typeof lv==='object'){v=Object.assign({},rv);for(const s in lv)v[s]=Math.max(v[s]||0,lv[s]||0)}

      else v=lv;

    if(ctx.pend.length){
      const used={},tok=new Map();
      const note=id=>{const s=splitId(id);if(s){used[s.p]=Math.max(used[s.p]||0,s.n)}};
      for(const k in out){if(Array.isArray(out[k]))out[k].forEach(x=>{if(x&&typeof x==='object'){if(x.id)note(x.id)}})}
      ctx.pend.forEach(p=>note(p.id));
      if(out.seq)for(const pf in PFX){const sv=out.seq[PFX[pf]];if(sv)used[pf]=Math.max(used[pf]||0,sv)}
      ctx.pend.forEach(p=>{const s=splitId(p.id);if(!s){return}const n=(used[s.p]||0)+1;used[s.p]=n;tok.set(p.id,s.p+String(n).padStart(s.z?s.w:0,'0'))});
      const fix=x=>{let t=JSON.stringify(x);tok.forEach((nw,old)=>{t=t.split('"'+old+'"').join('"'+nw+'"')});return JSON.parse(t)};
      for(const k in out){if(Array.isArray(out[k]))out[k]=out[k].map(x=>ctx.loc.has(x)?fix(x):x)}
      ctx.pend.forEach(p=>{const it=fix(p.item);if(tok.has(p.id))it[idKeyFor(p.name)]=tok.get(p.id);(out[p.name]=out[p.name]||[]).push(it);ctx.remap++});
    }
    /* counters must never be behind the ids that exist */
    if(out.seq){for(const k in out){if(Array.isArray(out[k]))out[k].forEach(x=>{const s=x&&x.id&&splitId(x.id);if(s&&PFX[s.p]){const sk=PFX[s.p];if((out.seq[sk]||0)<s.n)out.seq[sk]=s.n}})}}
    return{obj:out,conf:ctx.conf,lost:ctx.lost,remap:ctx.remap};
  }

  /* ---------- network ---------- */
  async function tokenReq(grant,body){
    let r;

    if(!r.ok||!j||!j.access_token){const e=authErr();e.bad=true;e.status=r.status;e.detail=String((j&&(j.error_description||j.msg||j.message||j.error_code||j.error))||'');throw e}
    auth={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,email:(j.user&&j.user.email)||(auth&&auth.email)||''};
    rawSet(AK,JSON.stringify(auth));
  }
  async function ensureAuth(){

      try{await tokenReq('refresh_token',{refresh_token:auth.rt})}
      catch(e){if(e.net)throw e;auth=null;rawDel(AK);throw authErr()}
    }
  }
  async function http(method,path,body,prefer){

    if(prefer)h.Prefer=prefer;
    let r;try{r=await fetch(SB_BASE+path,{method,headers:h,body})}catch(e){throw netErr()}
    if(r.status===401)throw authErr();
    const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}

  }
  async function getRow(k){

    if(!r.ok)throw new Error('get '+r.status);

  }

  /* ---------- reconcile one key with the cloud ---------- */
  async function reconcile(k){

    const loc=getLocal(k);
    if(!row){
      if(k==='state'){
        if(askedFirst===null){
          askedFirst=!!loc&&confirm('لا توجد نسخة في السحابة بعد.\n\nهل بيانات هذا الجهاز هي الأحدث؟\nاضغط «موافق» لرفعها كنسخة رئيسية تظهر على كل الأجهزة.\nاضغط «إلغاء» إن لم تكن متأكداً (افتح التطبيق من الجهاز الذي فيه آخر بياناتك).');
        }
        if(!askedFirst){paused=true;setStatus('paused');if(!loc)try{alert('لا توجد بيانات في السحابة ولا على هذا الجهاز. افتح التطبيق أولاً من الجهاز الذي فيه بياناتك ليرفعها.')}catch(e){}return false}
      }else if(askedFirst===false){return false}
